<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fichas – Pathfinder para Savage Worlds</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#e6e9ec;--card:#f6f7f8;--ink:#1c2330;--mut:#5b6573;--line:#c3cad2;--red:#8c1d2c;--redink:#fff;--brass:#a47e2f;--field:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--card:#1b212b;--ink:#e8eaee;--mut:#9aa4b2;--line:#303948;--red:#b3283a;--brass:#d2a94f;--field:#121821}}
:root[data-theme="dark"]{--bg:#12161d;--card:#1b212b;--ink:#e8eaee;--mut:#9aa4b2;--line:#303948;--red:#b3283a;--brass:#d2a94f;--field:#121821}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Alegreya Sans",system-ui,sans-serif}
h1,h2{font-family:Cinzel,Georgia,serif;margin:0}
header{background:var(--red);color:var(--redink);padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{font-size:1.25rem;letter-spacing:.02em}
header div{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 10px}
header button{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
section{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:4px 4px 10px 10px;padding:12px 14px}
section.wide{grid-column:1/-1}
h2{font-size:1rem;color:var(--red);margin-bottom:8px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) h2{color:var(--brass)}}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:5px;padding:5px 7px;width:100%}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:.85rem;color:var(--mut)}
.g{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.row{display:grid;gap:6px;align-items:center;grid-template-columns:1fr 84px 36px;padding:3px 0;border-bottom:1px dashed var(--line)}
.sk{grid-template-columns:1fr 88px 76px 52px 30px 30px}
.nm{background:none;border:0;text-align:left;font-weight:700;padding:4px 0}
.der{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.der div{border:1px solid var(--line);border-radius:8px;padding:8px 4px;background:var(--field)}
.der b{display:block;font:800 1.9rem Cinzel,serif;color:var(--red)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .der b{color:var(--brass)}}
.der input{text-align:center;padding:2px;width:60px;margin-top:2px}
.pt{font-size:.9rem;color:var(--mut);margin:0 0 6px}.pt b.bad{color:var(--red)}
.pips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.pip{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid var(--red)}
.pip.on{background:var(--red)}
.bene{border-color:var(--brass)}.bene.on{background:var(--brass)}
.w{display:grid;grid-template-columns:2fr .9fr 1fr .5fr .5fr .7fr 30px 30px;gap:6px;margin-bottom:6px}
.w.h{font-size:.8rem;color:var(--mut)}
#roll{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;max-width:92vw;text-align:center;z-index:5}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--red);color:#fff;padding:9px 14px;border-radius:10px;display:none;max-width:92vw;text-align:center;z-index:20}
.x{color:var(--red);padding:2px 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border-radius:999px;padding:6px 13px;font-weight:700;background:var(--field)}.chip:hover{border-color:var(--brass)}.pwc{border-radius:10px;text-align:left;display:flex;flex-direction:column;min-width:150px}.pwc span{font-weight:400;font-size:.85rem;color:var(--mut)}.tabs{display:flex;gap:4px;max-width:1100px;margin:12px auto 0;padding:0 16px}.tabs button{border-radius:8px 8px 0 0;font-weight:700}.tabs button.on{background:var(--red);color:#fff;border-color:var(--red)}#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}#md{background:var(--card);border-top:4px solid var(--red);border-radius:8px;max-width:520px;width:100%;max-height:85vh;overflow:auto;padding:16px}#md h2{font-size:1.2rem}#md p{white-space:pre-wrap;margin:10px 0}.bt{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.idw{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start}
.gi{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
@media(max-width:520px){.idw{grid-template-columns:1fr}}
.por{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.por img,.por .ph{width:100%;max-width:150px;aspect-ratio:3/4;object-fit:cover;border-radius:8px;border:2px solid var(--brass);background:var(--field)}
.por .ph{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:.85rem;text-align:center}
.por button{font-size:.85rem;padding:4px 8px}
.hist{margin:6px 0 0;padding-left:20px;font-size:.9rem;color:var(--mut)}
.lobby{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.lobby>p,.lobby>section{grid-column:1/-1}
.fc{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:4px 4px 10px 10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.th{padding:0;width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--field)}
.th img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.th span{font:800 3rem Cinzel,serif;color:var(--brass)}
.fi{display:flex;flex-direction:column}.fi b{font-family:Cinzel,Georgia,serif}.fi span{font-size:.9rem;color:var(--mut)}
.fa{display:flex;flex-wrap:wrap;gap:6px}.fa button{font-size:.85rem;padding:4px 8px}
.pwx{display:flex;gap:4px;align-items:stretch}
.mods{display:grid;gap:4px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.ck{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:.9rem}.ck input{width:auto}

/* ---- poderes ---- */
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.sh h2{margin:0}
.pbt{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.bnb{display:flex;flex-direction:column;font-size:.85rem;color:var(--mut)}.bnb b{font:800 1.5rem Cinzel,serif;color:var(--ink);line-height:1.25}
.pl{display:flex;flex-direction:column;gap:8px}
.pw{background:var(--field);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pw[open]{border-color:var(--brass)}
.pw>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px}
.pw>summary::-webkit-details-marker{display:none}
.cv{width:0;height:0;border-left:7px solid var(--mut);border-top:5px solid transparent;border-bottom:5px solid transparent;transition:transform .15s}
.pw[open] .cv{transform:rotate(90deg)}
.pwi{min-width:0;display:flex;flex-direction:column;gap:3px}
.pwn{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tg{font-size:.78rem;line-height:1.5;border:1px solid var(--line);border-radius:999px;padding:0 8px;white-space:nowrap;color:var(--mut);background:var(--card)}
.tg.pp{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.pre{font-size:.85rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pw[open] .pre{display:none}
.cb{background:var(--red);color:#fff;border-color:var(--red);font-weight:700;white-space:nowrap}
.pwb{padding:4px 14px 12px 36px;border-top:1px dashed var(--line)}
.pwb p{margin:8px 0;line-height:1.5}
.pwm{margin:10px 0}.pwm>b{font-size:.85rem;color:var(--mut)}
.pml{list-style:none;margin:4px 0 0;padding:0}
.pml li{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px dashed var(--line)}
.pml li b{white-space:nowrap}
.pwb .bt{justify-content:flex-start;margin-top:8px}
.ac{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.ac .an{flex:1 1 170px;min-width:0;display:flex;flex-direction:column}.ac .an small{color:var(--mut)}
.ac label{display:flex;gap:6px;align-items:center}.ac label input{width:64px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 70px 34px;gap:6px;align-items:start;margin-top:6px}
.mrow label{font-size:.75rem}
.mrn,.cxn{min-height:0;resize:none;overflow:hidden;line-height:1.3}
@media(max-width:420px){.pw>summary{grid-template-columns:14px minmax(0,1fr)}.pw>summary .cb{grid-column:2;justify-self:start}}
@media print{header,.no,#roll,#toast,#ov,#lobby,.tabs,.por .ph{display:none}body{background:#fff}main{display:block}section{break-inside:avoid;margin-bottom:8px}button{display:none}.pip{display:inline-block}}

:root{--chip:#e9ecf0;--epic:#b3811a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--chip:#252d3a;--epic:#e0b44a}}
:root[data-theme="dark"]{--chip:#252d3a;--epic:#e0b44a}
.co-bar{position:sticky;top:0;z-index:4;background:var(--bg);padding:8px 0;display:grid;gap:8px;border-bottom:1px solid var(--line);margin-bottom:10px}
.co-bar .r{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.co-bar input[type=search]{flex:1 1 220px;min-width:0}
.co button.on{background:var(--red);color:#fff;border-color:var(--red)}
.co-ct{color:var(--mut);font-size:.9rem;margin:0 0 8px}
.co details.p{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--red);border-radius:6px;margin:0 0 8px}
.co details.p>summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.co details.p>summary::-webkit-details-marker{display:none}
.co details.p>summary::before{content:"▸";color:var(--red);transition:transform .15s}
.co details.p[open]>summary::before{transform:rotate(90deg)}
.co .nm{font-family:Cinzel,Georgia,serif;font-weight:800;flex:1 1 200px}
.co .chips{display:flex;flex-wrap:wrap;gap:5px}
.co .chip{background:var(--chip);border:1px solid var(--line);border-radius:99px;padding:0 9px;font-size:.82rem;color:var(--mut);white-space:nowrap}
.co .chip.st{color:var(--ink);font-weight:700}
.co .bd{padding:2px 14px 14px;border-top:1px dashed var(--line)}
.co .stats{display:grid;gap:8px 14px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin:10px 0}
.co .stats div{background:var(--chip);border-radius:6px;padding:4px 9px}
.co .stats small{display:block;color:var(--mut);font-size:.74rem;text-transform:uppercase;letter-spacing:.05em}
.co .man{font-style:italic;color:var(--mut);margin:4px 0 10px}
.co .bd p{margin:0 0 8px}
.co h3{font-family:Cinzel,Georgia,serif;font-size:.9rem;color:var(--red);margin:14px 0 6px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .co h3{color:var(--brass)}}
:root[data-theme="dark"] .co h3{color:var(--brass)}
.co .mod{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:0 0 8px}
.co .mod.epic{border-left-color:var(--epic)}
.co .mh{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;margin-bottom:2px}
.co .mh b{font-family:Cinzel,Georgia,serif;font-size:.86rem}
.co .cost{background:var(--red);color:#fff;border-radius:5px;padding:0 7px;font-size:.82rem;font-weight:700}
.co .star{color:var(--epic)}
.co .box{border:1px solid var(--line);background:var(--chip);border-radius:6px;padding:8px 12px;margin:10px 0}
.co .box h4{margin:0 0 4px;font-family:Cinzel,Georgia,serif;font-size:.88rem}
.co .box p{margin:0 0 4px}
.co .tw{overflow-x:auto;margin:8px 0}
.co table{border-collapse:collapse;width:100%;font-size:.95rem}
.co th,.co td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.co th{background:var(--red);color:#fff;white-space:nowrap}
.co #cotb th,.co #cotb tbody tr{cursor:pointer}
.co #cotb tbody tr:hover{background:var(--chip)}
.co .add{margin-top:10px;background:var(--red);color:#fff;border-color:var(--red)}

.co-bar{gap:6px}
.co-bar select{width:auto;max-width:170px;flex:0 0 auto}
.co-bar input[type=search]{flex:1 1 150px}
.co .seg{display:flex;flex:0 0 auto}
.co .seg button{border-radius:0;margin-left:-1px}
.co .seg button:first-child{border-radius:6px 0 0 6px;margin:0}
.co .seg button:last-child{border-radius:0 6px 6px 0}
.co .sc{flex-wrap:nowrap!important;overflow-x:auto;padding-bottom:2px}
.co .sc button{flex:0 0 auto;padding:3px 10px}
.co .sc button[data-coe]:not([data-coe="Todos"])::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--sc);margin-right:6px}
.co .sc .sp{flex:1 0 8px}
.co .az{flex-wrap:nowrap!important;overflow-x:auto;gap:2px!important}
.co .az button{flex:0 0 auto;min-width:28px;padding:1px 6px;font-size:.85rem;font-weight:700}
.co .az button[disabled]{opacity:.28;cursor:default}
[data-st="Novato"]{--sc:#3f8f55}[data-st="Experiente"]{--sc:#3a7bbf}[data-st="Veterano"]{--sc:#8a5cb8}[data-st="Heroico"]{--sc:#d0702a}[data-st="Lendário"]{--sc:#b8902f}
.co details.p{border-left-color:var(--sc,var(--red));scroll-margin-top:170px}
.co details.p>summary{flex-wrap:nowrap;gap:12px;padding:10px 12px}
.co details.p>summary::before{color:var(--sc)}
.co .sm{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
.co .nm{flex:none;font-size:1.05rem}
.co .rs{color:var(--ink);font-size:.93rem;line-height:1.3}
.co .meta{color:var(--mut);font-size:.84rem;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;margin-top:2px}
.co .stg{background:var(--sc);color:#fff;border-radius:99px;padding:0 9px;font-weight:700;font-size:.78rem}
.co .ppb{flex:0 0 auto;text-align:center;border:2px solid var(--sc);border-radius:10px;min-width:52px;padding:3px 6px;line-height:1}
.co .ppb b{display:block;font-family:Cinzel,Georgia,serif;font-size:1.3rem;color:var(--sc)}
.co .ppb small{font-size:.68rem;color:var(--mut);letter-spacing:.06em}
.co .bd{padding:4px 14px 14px}
.co .bd>p{max-width:68ch;line-height:1.55}
.co .stats div{border-top:3px solid var(--sc)}
.co .mr{display:grid;grid-template-columns:60px 1fr;gap:10px;padding:7px 8px;border-radius:6px;max-width:80ch}
.co .mr:nth-child(odd){background:var(--chip)}
.co .mr.epic{box-shadow:inset 3px 0 0 var(--epic)}
.co .mr .cost{align-self:start;text-align:center;padding:1px 4px}
.co .mr p{margin:2px 0 0;line-height:1.45}
.co .mr .mn{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:.88rem}
.co .mh{display:none}
</style>
</head>
<body>
<header>
  <h1 id="ht">Fichas · Pathfinder para Savage Worlds</h1>
  <div class="no" id="hl">
    <button onclick="newF()">Nova ficha</button>
    <button onclick="addBald()">Carregar Balduin (exemplo)</button>
    <button onclick="document.getElementById('f').click()">Importar ficha</button>
    <button onclick="document.getElementById('fm').click()">Importar várias</button>
    <button onclick="expAll()">Exportar todas</button>
  </div>
  <div class="no" id="hs" hidden>
    <button onclick="toLobby()">← Voltar ao lobby</button>
    <button onclick="preset()">Carregar Balduin</button>
    <button onclick="exp()">Exportar</button>
    <button onclick="document.getElementById('f').click()">Importar</button>
    <button onclick="window.print()">Imprimir</button>
    <button onclick="reset()">Limpar ficha</button>
    <label style="display:flex;gap:4px;align-items:center;color:#fff">Mod. da rolagem<input id="rm" type="number" value="0" style="width:58px"></label>
  </div>
  <input id="f" type="file" accept=".json,application/json" hidden>
  <input id="fm" type="file" accept=".json,application/json" multiple hidden>
  <input id="fi" type="file" accept="image/*" hidden>
</header>
<div id="nost" class="no" hidden style="margin:0;padding:8px 16px;background:#7a5a10;color:#fff;font-size:.9rem;display:flex;gap:12px;align-items:center;justify-content:space-between"><span id="nostt"></span><button onclick="closeBanner()" aria-label="Fechar aviso" style="background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.4);flex:none">✕</button></div>
<nav class="tabs no" id="tabs" hidden><button id="t1" class="on" onclick="tab('ficha')">Ficha</button><button id="t3" onclick="tab('eq')">Equipamento</button><button id="t2" onclick="tab('pw')">Poderes</button><button id="t4" onclick="tab('co')">Compêndio</button></nav>
<main id="lobby" class="lobby"></main>
<main id="app" hidden></main>
<datalist id="skl"></datalist><div id="ov"><div id="md" role="dialog" aria-modal="true"></div></div>
<div id="roll" role="status" aria-live="polite"></div>

<script type="application/json" id="cdata">{"intro": ["Listados abaixo estão vários poderes disponíveis em <i>Savage Pathfinder<\/i>. Cada poder tem as seguintes estatísticas:", "<b>Estágio:<\/b> O Estágio no qual se deve estar para aprender o poder.", "<b>Pontos de Poder:<\/b> O custo para ativar o poder em Pontos de Poder.", "<b>Distância:<\/b> A distância máxima entre quem conjura e o efeito do poder. Distância muitas vezes é expressa como Astúcia ou algum múltiplo a partir dela. Se for o caso, leia Astúcia como quadros sobre a matriz de combate (o dobro disso em metros). Uma Astúcia d10, por exemplo, significa que o poder pode ser conjurado até 10 quadros (20 metros) de distância.", "A menos que o poder diga o contrário, Distância não tem efeito depois que o poder é ativado. Alguém que recebeu <i>invisibilidade<\/i>, por exemplo, pode se mover para além da Astúcia do conjurador sem efeitos adversos.", "<b>Duração:<\/b> Quanto tempo o poder dura em rodadas (a menos que indicado de outra forma). Poderes expiram após um número de rodadas igual a duração listada, no fim do turno de quem que o conjurou. Conte a rodada em que o poder é ativado. Se a clériga ativar <i>aumentar Característica<\/i> (Duração 5) na segunda rodada de combate, por exemplo, o poder permanece ativo até o fim do seu turno na sexta rodada. A duração de poderes pode ser estendida pela sua Duração base novamente ao custo de 1 Ponto de Poder por alvo.", "A menos que sua descrição diga o contrário, você pode encerrar um poder que ativou como uma ação livre. Deve encerrar o poder completamente — não pode encerrar para algumas pessoas atingidas e não para outras.", "<b>Escola:<\/b> A <b>Escola Arcana<\/b> da magia associada a este poder (veja a página 182).", "<b>Manifestações:<\/b> Estas são ideias descritivas e sugestões de como pode ser a aparência ou como o poder pode se manifestar em diferentes tipos de cenários.", "<b>Modificadores: Modificadores de Poder<\/b> específicos que o conjurador pode usar ao ativar o poder. Aqueles marcados com uma “estrela dourada” são Poderes Épicos. Eles são desbloqueados com Vantagens de Maestria Arcana e Divina (veja a página 178)."], "nomeando": ["É encorajado que as Manifestações e denominações sejam anotadas. Druidas em <i>Savage Pathfinder<\/i> poderiam anotar seus feitiços assim, por exemplo:", "• <i>Barreira<\/i> (Parede de espinhos)", "• <i>Aumentar/Reduzir Característica<\/i> (Bênção/ Maldição de Gozreh – um brilho levemente esverdeado saudável ou doentio)", "• <i>Enredar<\/i> (Enredar – vinhas que agarram brotando da terra)", "• <i>Proteção<\/i> (Pele de árvore – a pele se torna parecida com a casca de árvore)", "Um feiticeiro poderia anotar seus feitiços como:", "• <i>Barreira<\/i> (Parede de Energia)", "• <i>Aumentar/reduzir Características<\/i> (Ampliar/ Diminuir – um brilho lavanda ou púrpura)", "• <i>Enredar<\/i> (Prender – cordas etéreas)", "• <i>Proteção<\/i> (Armadura do Mago – escudo de energia etérea)"], "powers": [{"nome": "Amigo das Feras", "stats": {"estagio": "Novato", "pp": "Especial", "dist": "Astúcia", "dur": "10 minutos", "escola": "Encantamento", "manif": "Quem vai conjurar se concentra e gesticula com suas mãos."}, "body": ["Este feitiço permite que um indivíduo fale e guie as ações de feras da natureza. O custo para conjurar é igual ao valor do seu Tamanho (mínimo 1 por criatura; veja as criaturas no Capítulo Seis para exemplos). Controlar cinco lobos (Tamanho -1) custa 5 pontos (lembre do custo mínimo de 1), por exemplo. Controlar um rinoceronte (Tamanho 5) custa 5 pontos.", "Sucesso significa que a criatura obedece comandos simples, como um cão bem treinado. Ela ataca inimigos e coloca sua vida em risco por quem a controla. Uma ampliação na rolagem da perícia arcana significa que a fera é mais obediente. Ela não irá se matar, mas irá superar seus medos (fogo, criaturas assustadoras) para seguir suas ordens.", "Bandos também podem ser controlados. Bandos Pequenos custam 1 ponto, Bandos Médios custam 2 e Bandos Grandes 3.", "<i>Amigo das Feras<\/i> funciona apenas em criaturas naturais com inteligência animal, não em humanoides e não tem efeito em animais conjurados, mágicos ou “antinaturais”."], "mods": [{"name": "Bestiário", "epic": true, "desc": ["Quem conjura pode afetar feras mágicas com inteligência animal."], "cost": "+2"}, {"name": "Duração", "epic": false, "desc": ["A Duração base aumenta para 30 minutos."], "cost": "+1"}, {"name": "Passageiro da Mente", "epic": false, "desc": ["Permite se comunicar e sentir através da fera com a qual fez amizade."], "cost": "+1"}], "page": 185, "tabelas": [], "notas": [], "resumo": "Controla animais."}, {"nome": "Advinhação", "stats": {"estagio": "Experiente", "pp": "5", "dist": "Pessoal", "dur": "Uma breve conversa de cerca de cinco minutos.", "escola": "Adivinhação", "manif": "Sessões espíritas, interrogatório demoníaco."}, "body": ["<i>Adivinhação<\/i> permite entrar em contato com seres sobrenaturais para adquirir informação.", "Preparar o feitiço leva um minuto ininterrupto de preces, persuasão ou outro tipo de comunicação com um espírito ou divindade. Depois que o tempo de preparação estiver completo, faça uma rolagem de perícia arcana. Sucesso significa que a entidade responde da melhor maneira possível. Uma ampliação significa que o espírito é mais prestativo, melhor informado ou mais direto do que o habitual (quer ele deseje ser ou não).", "As respostas normalmente são vagas ou simbólicas e não diretas – eles fornecem pistas e orientação em vez de <i>spoilers<\/i> que podem arruinar um mistério ou aventura.", "O tipo de entidade contatada determina como ela se comunica. Espíritos do submundo tendem a conhecer apenas coisas pertinentes a sua vida e morte – e eles podem nem saber a identidade do seu assassino se a pessoa estava de máscara ou não foi vista.", "Da mesma forma, espíritos da natureza só conhecem sobre seus habitats, demônios sobre os assuntos nos quais estão diretamente envolvidos e daí em diante. Mestres de Jogo devem decidir o que a entidade sabe baseado em sua história, origem e personalidade.", "Uma vez que tenha se conversado com um espírito, ele não pode ser contatado novamente por 24 horas. Mestres de Jogo podem estender isso a uma comunidade de espíritos de um único lugar, como espíritos da água em um riacho barulhento ou espíritos sem nome em uma cova comum.", "<b>Solo Sagrado:<\/b> Contatar um espírito em solo considerado sagrado por ele (uma floresta para criaturas feéricas, um templo para divindades, um vulcão para elementais de fogo ou infernais, etc.) adiciona +2 à rolagem."], "mods": [{"name": "Poder", "epic": true, "desc": ["Este modificador funciona apenas em solo considerado sagrado pela entidade que o conjurador está tentando contatar – uma floresta sagrada para criaturas feéricas, um templo para divindades, um vulcão para elementais de fogo ou infernais etc. O ser pode até mesmo se manifestar ou aparecer de alguma forma com uma ampliação.", "A entidade não apenas irá responder a qualquer pergunta, mas também oferecerá conselhos não requisitados. O que exatamente ela diz e como, depende da entidade. Criaturas da floresta podem avisar quem conjurou sobre uma área perigosa na floresta. Um demônio pode se gabar de uma grande ameaça, dando pistas acidentais sobre outra entidade em um encontro posterior."], "cost": "+3"}], "page": 185, "tabelas": [], "notas": [], "resumo": "Permite fazer perguntas a entidades."}, {"nome": "Ajuda", "stats": {"estagio": "Novato", "pp": "1", "dist": "Astúcia", "dur": "Instantâneo/Uma hora", "escola": "Invocação", "manif": "Orações, mãos brilhantes, espirais cintilantes de magia, uma brisa fresca."}, "body": ["<i>Ajuda<\/i> permite a quem conjura recuperar uma condição negativa dos efeitos de Fadiga.", "<b>Recuperação:<\/b> Remove uma das seguintes condições negativas: Abalado, Distraído ou Vulnerável. Uma ampliação na rolagem da perícia arcana remove duas condições. Se afetar mais de um alvo (através do modificador Receptores Adicionais) é possível escolher que condições remover de cada aliado.", "<i>Ajuda<\/i> não remove condições negativas causadas por efeitos que estejam acontecendo (Preso ou Enredado, Atordoado etc.) a menos que a fonte do efeito seja removida.", "<b>Entorpecer:<\/b> Com um sucesso reduz o total de penalidades de Ferimentos e Fadiga do receptor em um (ou dois com uma ampliação). Alguém Exausto (-2) e com três Ferimentos (-3), por exemplo, reduziria seu total de -5 para -4 com um sucesso ou -3 com uma ampliação.", "Esse efeito dura uma hora. Isso não remove realmente os Ferimentos ou Fadiga, apenas permite que o receptor possa ignorar as penalidades. Se o alvo ficaria Incapacitado pelos Ferimentos ou Fadiga, ele fica Incapacitado como de costume"], "mods": [{"name": "Atordoado", "epic": false, "desc": ["Se usar a opção de Recuperação, é possível também remover a condição Atordoado. Isso remove completamente os efeitos de Atordoado."], "cost": "+1"}, {"name": "Receptores Adicionais", "epic": false, "desc": ["O poder afeta um novo alvo para cada Ponto de Poder adicional."], "cost": "+1"}, {"name": "Restauração", "epic": false, "desc": ["Quem conjura pode restaurar um tipo de dado de um efeito de dreno de energia com um sucesso, dois com uma ampliação. Veja <b>Drenar Energia<\/b> na página 251."], "cost": "+3"}], "page": 186, "tabelas": [], "notas": [], "resumo": "Remove os estados Abalado, Distraído ou Vulnerável (2 com uma ampliação), ou ignora 1 ponto de penalidade de Ferimento e Fadiga (2 com uma ampliação)."}, {"nome": "Âncora Planar", "stats": {"estagio": "Veterano", "pp": "8", "dist": "Astúcia", "dur": "Instantânea", "escola": "Invocação", "manif": "Um círculo de invocação, um encantamento, um caixão de ferro, correntes mágicas."}, "body": ["Quem conjura invoca uma criatura de outro plano, a prendendo em algum tipo de prisão, como um círculo de aprisionamento. A armadilha é criada com giz, sal, glifos e proteções ou outros materiais antes da ativação do poder e leva 10 minutos para ser preparada.", "Uma vez preparada, quem conjura seleciona um Extraplanar para convocar. É necessário saber sobre a criatura de alguma forma, quem sabe de encontros anteriores, acesso a livros e pergaminhos ou uma rolagem de Ocultismo com um modificador estabelecido pelo Mestre de Jogo. É possível convocar uma entidade específica se souber o nome correto.", "A convocação é uma rolagem resistida entre a perícia arcana de quem conjura e o Espírito da entidade. Se a magia falhar a entidade sabe quem está tentando prendê-lo. Se quem conjurar rolar uma Falha Crítica, a criatura pode aparecer se quiser e está livre – pode fazê-lo se desejar e suas habilidades permitirem.", "Se quem conjura vencer, a criatura é invocada na armadilha e presa magicamente até que concorde em realizar um serviço para o conjurador ou liberte-se (veja a seguir). Os Pontos de Poder usados para prender o alvo são investidos e ficam indisponíveis até que a criatura se liberte ou complete a tarefa.", "<b>Barganhando:<\/b> Conjuradores invocam criaturas para realizar tarefas para eles, um “serviço” de algum tipo, como fazer parte de um combate difícil, agir como guarda-costas ou alguma tarefa difícil ou desagradável. A negociação pode ser conduzida por interpretação (e quem sabe uma rolagem de Persuadir ou Intimidar).", "Criaturas astutas requerem mais incentivos. Um ser maligno pode pedir por algum tempo vagando a terra e causar devastação, um sacrifício ou outro tipo de “barganha com o diabo” proporcional ao serviço requisitado. Uma criatura boa ou nobre pode, se a causa for justa, ajudar a quem a invoca sem pedir nada em troca ou pode pedir para que realize alguma tarefa para seus seguidores ou área de influência. Entidades nunca concordam com demandas impossíveis ou não razoáveis.", "Uma vez que a criatura concorde com os termos, ela o fará com o melhor de suas habilidades. Quem conjura não precisa cumprir nenhuma das promessas que fez – embora entidades possam buscar vingança se enganadas ou se forem convocadas muitas vezes. Conjuradores devem estar cientes disso; principalmente se os seres possuírem um caminho para o plano material!", "<b>Se libertando:<\/b> Se nenhum acordo for feito após 24 horas, o conjurador deve renovar seus elos místicos realizando uma nova rolagem resistida de sua perícia arcana contra o Espírito da criatura. Isso continua a cada 24 horas até que se chegue a um acordo ou a criatura se liberte. A entidade não pode usar qualquer poder ou habilidade para escapar."], "mods": [], "page": 187, "tabelas": [], "notas": [], "resumo": "Invoca e prende uma criatura de outro plano."}, {"nome": "Andar Nas Paredes", "stats": {"estagio": "Novato", "pp": "2", "dist": "Astúcia", "dur": "5", "escola": "Transmutação", "manif": "Traços ou feição de aranha, pelos espinhosos nas mãos e nos pés."}, "body": ["<i>Andar nas paredes<\/i> permite deslocar-se em superfícies verticais ou horizontais. Com sucesso, a pessoa irá se mover com a metade da sua Movimentação normal. Com uma ampliação, pode se mover com toda sua Movimentação e ainda pode correr.", "Se fizer uma rolagem de Atletismo para escalar ou se agarrar a uma superfície, adiciona +4 ao total."], "mods": [{"name": "Receptores Adicionais", "epic": false, "desc": ["É possível afetar outras pessoas a um custo de 1 Ponto de Poder cada."], "cost": "+1"}], "page": 188, "tabelas": [], "notas": [], "resumo": "Personagem pode andar nas paredes com metade da Movimentação (Movimentação total com uma ampliação)."}, {"nome": "Atordoar", "stats": {"estagio": "Novato", "pp": "2", "dist": "Astúcia", "dur": "Instantânea", "escola": "Evocação", "manif": "Raios de energia, bombas atordoantes, estampidos, explosão de luz ofuscante."}, "body": ["<i>Atordoar<\/i> impacta o alvo com força concussiva, som, luz, energia mágica ou afins.", "Uma conjuração bem-sucedida significa que a vítima deve fazer uma rolagem de Vigor (com -2 em uma ampliação na rolagem da perícia arcana) ou fica em Estado <b>Atordoado<\/b> (veja a página 139)."], "mods": [{"name": "Área", "epic": false, "desc": ["Por +2 pontos o poder afeta quem estiver dentro de um Modelo Médio de Explosão. Por +3 pontos a área de efeito é aumentada para um Modelo Grande de Explosão."], "cost": "+2/+3"}], "page": 188, "tabelas": [], "notas": [], "resumo": "Alvo fica Atordoado."}, {"nome": "Aumentar/Reduzir Característica", "stats": {"estagio": "Novato", "pp": "2", "dist": "Astúcia", "dur": "5 ( aumentar ); Instantâneo ( reduzir )", "escola": "Transmutação (aumentar); Necromancia (reduzir)", "manif": "Mudança física, aura brilhante, poções."}, "body": ["Este poder permite aumentar ou reduzir uma Característica do alvo (atributo ou perícia).", "<i>Aumentar<\/i> uma Característica de alguém, aumenta a Característica selecionada em um tipo de dado, ou dois com uma ampliação.", "<i>Reduzir<\/i> uma Característica tem Duração Instantânea e reduz o atributo ou perícia selecionada em um tipo de dado com um sucesso, ou em dois com uma ampliação (até um mínimo de d4). A vítima tenta automaticamente se livrar do efeito com uma rolagem de Espírito, como uma ação livre no fim dos seus turnos seguintes. Sucesso melhora o efeito em um tipo de dado e uma ampliação remove o efeito completamente.", "Conjurações adicionais não se acumulam em uma única Característica (escolha a maior), mas podem afetar Características <i>diferentes<\/i>."], "mods": [{"name": "Aumentar/Reduzir Característica Melhorada", "epic": true, "desc": ["Com um sucesso, a Característica selecionada ganha uma rerrolagem uma vez por rodada ou uma vez por ação com uma ampliação. Para <i>reduzir característica<\/i> o alvo também aplica uma penalidade de -2 à Característica afetada."], "cost": "+2"}, {"name": "Forte", "epic": false, "desc": ["<i>Apenas para Reduzir Característica<\/i>. A rolagem de Espírito para se livrar do efeito é feita com -2."], "cost": "+1"}, {"name": "Receptores Adicionais", "epic": false, "desc": ["O poder afeta um novo alvo para cada Ponto de", "Poder adicional."], "cost": "+1"}], "page": 188, "tabelas": [], "notas": [], "resumo": "Aumenta ou reduz uma perícia ou atributo."}, {"nome": "Banir", "stats": {"estagio": "Veterano", "pp": "3", "dist": "Astúcia", "dur": "Instantânea", "escola": "Abjuração", "manif": "Itens sagrados, símbolos arcanos, punhado de sal."}, "body": ["<i>Banir<\/i> manda entidades de planos imateriais de volta para suas dimensões nativas. Isso inclui fantasmas, demônios, elementais e criaturas similares (critério do Mestre).", "<i>Banir<\/i> uma criatura é uma rolagem resistida da perícia arcana contra o Espírito do alvo. Sucesso significa que o alvo é Abalado e cada ampliação causa um Ferimento.", "Se isso Incapacitar o alvo, ele retorna para seu plano nativo de existência. <i>Entidades Banidas<\/i> podem retornar quando o Mestre de Jogo considerar apropriado ou, até mesmo, algumas rodadas depois, se a criatura possuir a habilidade de viajar entre planos por conta própria."], "mods": [{"name": "Área", "epic": true, "desc": ["O poder afeta tudo em um Modelo Pequeno, Médio ou Grande."], "cost": "+1/+2/+3"}], "page": 189, "tabelas": [], "notas": [], "resumo": "Rolagem resistida contra Espírito para banir entidades."}, {"nome": "Barreira", "stats": {"estagio": "Experiente", "pp": "2", "dist": "Astúcia", "dur": "5", "escola": "Invocação", "manif": "Fogo, gelo, espinhos, ossos, energia."}, "body": ["<i>Barreira<\/i> cria um muro de 5 quadros (10 metros) de comprimento e 1 quadro (2 metros) de altura, de um material imóvel que está em conformidade com a superfície sobre o qual é conjurado. Dobre o comprimento com uma ampliação.", "A espessura varia dependendo do que o muro é feito, mas geralmente é de alguns centímetros.", "O muro tem Dureza 10 (ou 12 com uma ampliação) e pode ser destruído como qualquer outro objeto (veja <b>Quebrando Coisas<\/b> na página 147). Cada Ferimento destrói um espaço de um quadro por um quadro (2 metros quadrados) de seção de parede (armas perfurantes não podem danificar a <i>barreira<\/i>).", "Quando o feitiço acaba ou o muro é quebrado, ele se esfarela em poeira ou se dissipa, nunca deixando quaisquer rastros ou evidências de sua manifestação."], "mods": [{"name": "Dano", "epic": false, "desc": ["A barreira causa 2d4 de dano para todos que entrarem em contato com ela. Se a barreira for imaterial, como uma parede de fogo, este modificador custa +0 em vez de +1."], "cost": "+0/+1"}, {"name": "Endurecida", "epic": false, "desc": ["Dureza do muro é 12 (14 com uma ampliação)."], "cost": "+1"}, {"name": "Modelado", "epic": false, "desc": ["A barreira forma um círculo, quadrado ou retângulo. Não pode formar um teto ou um chão e não pode Prender ou Enredar (use o poder <i>enredar<\/i> para isso)."], "cost": "+1"}, {"name": "Mortal", "epic": true, "desc": ["A barreira causa 2d6 de dano."], "cost": "+2"}, {"name": "Tamanho", "epic": false, "desc": ["O comprimento e altura da <i>barreira<\/i> dobram."], "cost": "+2"}], "page": 189, "tabelas": [], "notas": [], "resumo": "Cria uma barreira de 5 quadros (10 metros) de comprimento e 1 quadro (2 metros) de altura, Dureza 10 (12 com uma ampliação)."}, {"nome": "Campo de Dano", "stats": {"estagio": "Experiente", "pp": "4", "dist": "Astúcia", "dur": "5", "escola": "Abjuração", "manif": "Aura flamejante, espinhos, campo elétrico."}, "body": ["<i>Campo de dano<\/i> cria uma aura perigosa ao redor de quem a recebe, ferindo qualquer personagem que seja imprudente o suficiente para se aproximar.", "No fim do turno da pessoa afetada, todos os indivíduos adjacentes (incluindo aliados!) recebem automaticamente 2d4 de dano."], "mods": [{"name": "Área", "epic": false, "desc": ["Quem conjura pode estender o <i>campo de dano<\/i> para um Modelo Médio de Explosão centrado no receptor, o conjurador é imune a seu próprio campo de dano."], "cost": "+2"}, {"name": "Campo de Dano Melhorado", "epic": true, "desc": ["O <i>campo de dano<\/i> causa 3d6 de dano e é considerado Arma Pesada."], "cost": "+4"}, {"name": "Dano", "epic": false, "desc": ["O <i>campo de dano<\/i> causa 2d6 de dano."], "cost": "+2"}, {"name": "Móvel", "epic": false, "desc": ["Móvel funciona apenas com o Modificador Área. Permite que quem o conjurou separe o <i>campo de dano<\/i> do receptor e o mova até seu dado de Astúcia a cada rodada como ação livre."], "cost": "+2"}], "page": 189, "tabelas": [], "notas": [], "resumo": "Cria uma aura que causa 2d4 de dano."}, {"nome": "Cavar", "stats": {"estagio": "Novato", "pp": "2", "dist": "Astúcia", "dur": "5", "escola": "Invocação", "manif": "Dissolver-se na terra e aparecer em outro lugar, corpo de areia."}, "body": ["<i>Cavar<\/i> permite mesclar-se com a terra. É possível permanecer no subterrâneo se quiser ou <i>cavar<\/i> através do solo com a metade da Movimentação normal (ou Movimentação inteira com uma ampliação). Não é possível correr.", "Alguém que está <i>cavando<\/i> pode tentar surpreender oponentes fazendo uma rolagem resistida de Furtividade contra Perceber. Se vencer o alvo fica Vulnerável <i>apenas para a pessoa cavando<\/i>. Com uma ampliação, consegue a Finalização. Alvos Aguardando podem tentar interromper o ataque antes que ele ocorra.", "Cavadores geralmente não podem surpreender oponentes depois que sua presença é descoberta, mas ainda podem cavar em busca de proteção e mobilidade."], "mods": [{"name": "Poder", "epic": false, "desc": ["Permite <i>cavar<\/i> através de pedra, concreto ou substâncias similares. (Algumas substâncias como, vidro, chumbo etc. podem ser resistentes, a critério do Mestre)."], "cost": "+1"}, {"name": "Receptores Adicionais", "epic": false, "desc": ["O poder afeta um novo alvo para cada Ponto de Poder adicional."], "cost": "+1"}], "page": 190, "tabelas": [], "notas": [], "resumo": "Alvo cria túneis sob a terra."}, {"nome": "Cegar", "stats": {"estagio": "Novato", "pp": "2", "dist": "Astúcia", "dur": "Instantânea", "escola": "Necromancia", "manif": "Lampejo de luz brilhante, areia nos olhos, confusão."}, "body": ["Pessoas afetadas por este poder malicioso sofrem com uma visão turva ou <i>cegueira<\/i> quase que completa com uma ampliação.", "Sucesso significa que a vítima sofre uma penalidade de -2 em todas as ações que envolvam visão ou -4, com uma ampliação.", "A vítima tenta automaticamente se livrar do efeito com uma rolagem de Vigor como uma ação livre no fim dos seus turnos seguintes. Sucesso remove 2 pontos de penalidades e uma ampliação remove o efeito completamente."], "mods": [{"name": "Área", "epic": false, "desc": ["Por +2 pontos o poder afeta quem estiver dentro de um Modelo Médio de Explosão. Por +3 pontos a área de efeito é aumentada para um Modelo Grande de Explosão."], "cost": "+2/+3"}, {"name": "Forte", "epic": false, "desc": ["A rolagem de Vigor para se livrar do efeito é feita com -2."], "cost": "+1"}], "page": 190, "tabelas": [], "notas": [], "resumo": "Inflige uma penalidade de -2/-4 às vítimas."}, {"nome": "Confusão", "stats": {"estagio": "Novato", "pp": "2", "dist": "Astúcia", "dur": "Instantânea", "escola": "Encantamento", "manif": "Luzes hipnóticas, ilusões breves, barulhos."}, "body": ["<i>Confusão<\/i> afeta todos os alvos em um Modelo Médio de Explosão, deixando-os Distraídos ou Vulneráveis, ou ambos com uma ampliação. O mesmo efeito se aplica a todos os afetados. Esses estados são removidos no fim do próximo turno da vítima como de costume."], "mods": [{"name": "Área", "epic": false, "desc": ["Quem conjura pode focar <i>confusão<\/i> em um Modelo Pequeno de Explosão sem custo extra ou um Modelo Grande de Explosão por +1."], "cost": "+0/+1"}, {"name": "Confusão Melhorada", "epic": true, "desc": ["Com um sucesso, alvos estão Abalados além de ficarem Distraídos ou Vulneráveis (ambos com uma ampliação). <i>Confusão<\/i> é um efeito que não causa dano e não pode ser usado para causar Ferimentos em um alvo já Abalado."], "cost": "+2"}], "page": 190, "tabelas": [], "notas": [], "resumo": "Deixa o alvo Distraído e Vulnerável."}, {"nome": "Conjurar Aliado", "stats": {"estagio": "Novato", "pp": "Especial", "dist": "Astúcia", "dur": "5", "escola": "Invocação", "manif": "Figura de barro que cresce e vira um servo, tatuagem que ganha vida."}, "body": ["Este poder permite conjurar alguém para auxiliar a partir do nada. Normalmente assume a forma de um humanoide básico do Tamanho apropriado, mas pode ter aparência diferente baseado nas manifestações de quem conjura. Se materializa em qualquer lugar dentro da Distância e com uma ampliação na rolagem da perícia arcana será Resiliente.", "O ser age na Carta de Ação de quem a conjurou e segue seus comandos da melhor maneira possível. A conjuração não tem personalidade, criatividade ou emoções. Quando o poder acaba ou o aliado é Incapacitado, desaparece em um vazio, sem deixar quaisquer vestígios.", "O tipo de serviçal que se pode conjurar depende do Estágio. Com a aprovação do Mestre é possível trocar habilidades. Se quem conjura quiser que a criação tenha a forma de lobo, por exemplo, deve trocar a perícia Atirar por Sobrevivência para que o “animal” possa rastrear."], "mods": [{"name": "Aliados Adicionais", "epic": true, "desc": ["Aliados adicionais do mesmo tipo podem ser conjurados ao mesmo tempo pela metade do custo em Pontos de Poder da convocação original (o custo total, incluindo modificadores, é arredondado para cima)."], "cost": "variável"}, {"name": "Aumentar Característica", "epic": false, "desc": ["É possível aumentar uma Característica em um tipo de dado por um Ponto de Poder. Pode fazer isso para quantas Características desejar, mas apenas uma vez por Característica."], "cost": "+1"}, {"name": "Mordida/Garra", "epic": false, "desc": ["A criação pode usar uma mordida ou garra com For+d6."], "cost": "+1"}, {"name": "Passageiro da Mente", "epic": false, "desc": ["Quem conjurou pode se comunicar e sentir através do ser."], "cost": "+1"}, {"name": "Vantagem de Combate", "epic": false, "desc": ["A criação tem uma Vantagem de Combate (deve atender os requisitos como de costume). Pode adquirir este modificador até três vezes por aliado."], "cost": "+1"}, {"name": "Voo", "epic": false, "desc": ["A criação pode voar com uma", "Movimentação 12."], "cost": "+2"}], "page": 190, "tabelas": [{"titulo": "Servos por Estágio", "cab": ["Estágio", "Custo", "Servo"], "linhas": [["Novato", "2", "Assistente"], ["Experiente", "4", "Guarda-costas"], ["Veterano", "6", "Reflexo Pessoal*"], ["Heroico", "8", "Sentinela"]], "nota": "*Reflexo Pessoal custa +2 pontos de poder por Estágio acima do Veterano até um máximo de 10 PPs no Lendário."}], "notas": [], "fichas": [{"titulo": "Assistente", "linhas": ["Atributos: Agilidade d4, Astúcia d4, Espírito d4, Força d4, Vigor d4", "Perícias: Atirar d4, Atletismo d4, Furtividade d6, Lutar d4, Perceber d4", "Movimentação: 4; Aparar: 4; Resistência: 4", "Habilidades Especiais:", "• Garras: For+d4.", "• Construto: +2 para se recuperar do estado de Abalado; ignora 1 ponto de Penalidades por Ferimento; não respira, imune a doenças e veneno.", "• Destemido: Imune a Medo e Intimidação."]}, {"titulo": "Guarda-Costas", "linhas": ["Atributos: Agilidade d6, Astúcia d4, Espírito d6, Força d6, Vigor d6", "Perícias: Atirar d4, Atletismo d6, Furtividade d4, Intimidar d6, Lutar d6, Perceber d4", "Movimentação: 6; Aparar: 5; Resistência: 7 (2)", "Vantagens: Atacar Primeiro", "Equipamento: Ataque Corpo a Corpo (For+d6).", "Habilidades Especiais:", "• Armadura +2: Pele endurecida", "• Construto: Veja Assistente.", "• Destemido: Imune a Medo e Intimidação."]}, {"titulo": "Reflexo Pessoal", "linhas": ["É um clone de quem conjurou (mas em termos de regras é um Extra); tem o mesmo número atual de Pontos de Poder do conjurador após subtrair os usados em sua conjuração; não pode usar o poder conjurar aliado ; suas perícias (mas não atributos) são um tipo de dado a menos (mínimo d4) do que as originais; tem equipamento mundano idêntico (sem propriedades mágicas, desaparece quando o poder expira); tem as habilidades Construto e Destemido ."]}, {"titulo": "Sentinela", "linhas": ["Atributos: Agilidade d6, Astúcia d6, Espírito d8, Força d12+2, Vigor d10", "Perícias: Atletismo d6, Intimidar d10, Lutar d10, Perceber d8", "Movimentação: 6; Aparar: 7; Resistência: 13 (4)", "Vantagens: Resistência Arcana, Varredura Aprimorada.", "Equipamento: Ataque Corpo a Corpo (For+d8).", "Habilidades Especiais:", "• Armadura +4: Pele de pedra.", "• Construto: Veja Assistente.", "• Destemido: Imune a Medo e Intimidação.", "• Tamanho 2: Sentinelas têm cerca de 2,45 metros de altura e corpo massivo."]}], "resumo": "Conjura algum tipo de criatura aliada."}, {"nome": "Conjurar Item", "stats": {"estagio": "Novato", "pp": "2 por 1/2 Kg", "dist": "Astúcia", "dur": "Uma hora", "escola": "Invocação", "manif": "Luz que forma a silhueta do item, pegar um item em uma bolsa mágica, modelar sujeira ou barro no item, puxar o item de um desenho ou pintura."}, "body": ["Quem conjura pode criar um objeto pesando até meio quilo para cada 2 Pontos de Poder gastos. O item deve ser simples, objetos mundanos feitos de material comum (decisão do Mestre) tal como uma vara de 3 metros, cobertor, escudo etc. Uma ampliação na rolagem da perícia arcana produz uma versão mais resistente do item conjurado.", "Itens conjurados aparecem nas mãos de quem conjura ou no chão nas proximidades. Uma vez que a Duração expira, o item desaparece da realidade. Isso pode trazer problemas, por exemplo, se o item conjurado mantinha uma porta aberta ou foi dado como presente."], "mods": [{"name": "Completo", "epic": false, "desc": ["O objeto é um conjunto completo como um kit de xadrez ou uma aljava de flechas. O conjunto deve se encaixar no peso limite."], "cost": "+1"}, {"name": "Criar Comida e Água", "epic": false, "desc": ["Em vez de um objeto, cada 1 Ponto de Poder cria comida e água suficiente para manter um humanoide de Tamanho 0 por um dia. A comida nutritiva é permanente (não desaparece após comê-la), embora apodreça e fique imprópria para comer após 24 horas se não for consumida. A água é como água limpa de chuva e não estraga."], "cost": "Especial"}, {"name": "Durável", "epic": false, "desc": ["A Duração do objeto se torna “permanente” até ser dissipada. Os Pontos de Poder são “investidos” e ficam indisponíveis até que o objeto seja destruído, dissipado ou cancelado por quem conjurou. O conjurador pode dissipar o objeto a qualquer hora, independente da visão, distância ou outros fatores. Seus Pontos de Poder então começam a recarregar normalmente."], "cost": "+1 por meio quilo"}], "page": 192, "tabelas": [], "notas": [], "resumo": "Conjura objetos, 2 Pontos de Poder para cada 1/2 quilo."}, {"nome": "Crescimento/Encolhimento", "stats": {"estagio": "Experiente", "pp": "2 por ponto de mudança de Tamanho", "dist": "Astúcia", "dur": "5", "escola": "Transmutação", "manif": "Gestos, palavras de poder, poções."}, "body": ["<i>Crescimento<\/i> aumenta o Tamanho do receptor em 1 a cada 2 Pontos de Poder gastos. Cada aumento em Tamanho concede ao alvo o aumento de um passo em Força e 1 ponto de Resistência (veja página 149 para mais sobre <b>Tamanho<\/b>). Isso não aumenta a quantidade de Ferimentos que pode receber independente da Escala.", "<i>Encolhimento<\/i> reduz o Tamanho do alvo um passo a cada 2 Pontos de Poder gastos até um máximo de Tamanho -2 (aproximadamente o tamanho de um gato). Cada passo reduzido diminui a Força em um tipo de dado (mínimo de d4) e Resistência em 1 (mínimo de 2).", "Para alvos relutantes, a rolagem da perícia arcana do conjurador é resistida por Espírito."], "mods": [{"name": "Duração", "epic": true, "desc": ["A Duração do poder é mensurada em minutos em vez de rodadas."], "cost": "+2"}, {"name": "Poder", "epic": true, "desc": ["O alvo de <i>encolhimento<\/i> pode manter sua Força e Resistência normais enquanto encolhidos."], "cost": "+2"}], "page": 192, "tabelas": [], "notas": [], "resumo": "Aumenta ou diminui de Tamanho."}, {"nome": "Cura", "stats": {"estagio": "Novato", "pp": "3", "dist": "Toque", "dur": "Instantânea", "escola": "Invocação", "manif": "Colocar as mãos, tocar a vítima com um símbolo sagrado, oração."}, "body": ["<i>Cura<\/i> remove Ferimentos que foram sofridos há menos de uma hora. Um sucesso remove um Ferimento e uma ampliação dois. O poder pode ser conjurado várias vezes para remover Ferimentos adicionais durante aquela hora, contanto que haja Pontos de Poder suficientes.", "Para Extras, Mestres devem determinar primeiro se o Aliado ainda vive (veja <b>Consequências<\/b>, página 154). Se for o caso, uma rolagem bem-sucedida da perícia arcana coloca o aliado de volta à ação (em Estado Abalado, se isso importar)."], "mods": [{"name": "Cura em Massa", "epic": true, "desc": ["Por +2 Pontos de Poder <i>cura<\/i> afeta todos os aliados dentro de um Modelo Médio de Explosão centrado em quem conjura (ou um Modelo Grande de Explosão por +3)."], "cost": "+2/+3"}, {"name": "Cura Melhorada", "epic": false, "desc": ["<i>Cura maior<\/i> pode restaurar qualquer Ferimento, incluindo aqueles ocorridos há mais de uma hora."], "cost": "+10"}, {"name": "Lesões Debilitantes", "epic": false, "desc": ["O poder pode curar uma Lesão Debilitante permanente (veja <b>Incapacitação<\/b>, página 132). Isto requer uma hora de preparação e apenas uma conjuração é permitida por lesão. Se falhar, não pode <i>curar<\/i> aquela lesão em particular (mas outra pessoa pode tentar). Se bem-sucedido, o alvo fica Exausto por 24 horas."], "cost": "+15"}, {"name": "Neutralizar Veneno ou Doença", "epic": false, "desc": ["Uma rolagem bem-sucedida de <i>cura<\/i> anula qualquer veneno ou doença. Se o veneno ou doença possuir um bônus ou penalidade associado, o modificador também se aplica na rolagem da perícia arcana."], "cost": "+1"}], "page": 192, "tabelas": [], "notas": [], "resumo": "Remove Ferimentos que foram sofridos há menos de uma hora."}, {"nome": "Dádiva do Guerreiro", "stats": {"estagio": "Experiente", "pp": "4", "dist": "Astúcia", "dur": "5", "escola": "Invocação", "manif": "Gestos, prece, palavras sussurradas, concentração."}, "body": ["Com uma rolagem bem-sucedida da perícia arcana, quem recebe ganha os benefícios de uma única Vantagem de Combate escolhida por quem conjura. Quem conjura (não quem recebe) deve ter o mesmo Estágio ou maior que os requisitos da Vantagem. Com uma ampliação concede a versão Aprimorada da Vantagem (se houver e mesmo que não cumpra o requisito de Estágio)."], "mods": [{"name": "Poder", "epic": true, "desc": ["O receptor ganha duas", "Vantagens de Combate de uma só vez."], "cost": "+4"}, {"name": "Receptores Adicionais", "epic": false, "desc": ["O poder afeta um novo alvo para cada Ponto de Poder adicional."], "cost": "+1"}], "page": 193, "tabelas": [], "notas": [], "resumo": "Concede uma Vantagem de Combate."}, {"nome": "Deflexão", "stats": {"estagio": "Novato", "pp": "2", "dist": "Astúcia", "dur": "5", "escola": "Abjuração", "manif": "Escudo místico, rajada de vento, servo fantasma que intercepta os projéteis."}, "body": ["<i>Poderes de Deflexão<\/i> funcionam de várias formas. Algumas manifestações de fato <i>defletem<\/i> ataques recebidos, outras borram a forma do alvo ou produzem efeitos ilusórios. Contudo, o resultado final sempre é o mesmo – desviar ataques corpo a corpo ou a distância de quem utiliza o poder.", "Se bem-sucedido, oponentes subtraem 2 de ataques corpo a corpo ou de longa distância (escolha de quem conjura). Com uma ampliação a penalidade se aplica a ambos.", "Atacantes que usem uma arma de longa distância em corpo a corpo contra a pessoa afetada por este poder sofrem a penalidade da mesma forma."], "mods": [{"name": "Receptores Adicionais", "epic": false, "desc": ["O poder afeta um novo alvo para cada Ponto de Poder adicional."], "cost": "+1"}], "page": 193, "tabelas": [], "notas": [], "resumo": "-2 / -4 para atacar quem recebe."}, {"nome": "Detectar/Ocultar Arcano", "stats": {"estagio": "Novato", "pp": "2", "dist": "Astúcia", "dur": "5 ( detectar ); uma hora ( ocultar )", "escola": "Adivinhação ( detectar ; Ilusão ( ocultar )", "manif": "Aceno de mãos, palavras sussurradas."}, "body": ["<i>Detectar arcano<\/i> permite ver e detectar todas as pessoas, objetos ou efeitos sobrenaturais à vista por cinco rodadas. Isto inclui oponentes <i>invisíveis<\/i>, encantamentos em pessoas ou itens e daí em diante. Com uma ampliação, também é possível saber o tipo geral do encantamento.", "Quando usado em uma criatura sobrenatural, quem conjurou sabe seus poderes e habilidades especiais ativos. Com uma ampliação ele também sabe Fraquezas comuns a esse tipo de criatura. Isso não revela Fraquezas de indivíduos únicos, se possuírem. Estes normalmente devem ser descobertos através de pesquisa ou tentativa e erro.", "<b>Criaturas Invisíveis:<\/b> <i>Detectar arcano<\/i> também permite ignorar até 4 pontos de penalidades para atacar rivais que tenham se escondido com escuridão mágica, invisibilidade ou habilidades similares (ou todas as penalidades com uma ampliação).", "<i>Ocultar arcano<\/i> evita a detecção de energias arcanas em uma criatura ou item de Escala Normal por uma hora (veja <b>Detectar Magia<\/b> na página 175 e a <b>Tabela de Tamanho<\/b> na página 254). Para criaturas maiores, aumente o custo pela Escala de Modificador (+2 PP para Grande, +4 PP para Enorme ou +6 PP para Colossal).", "Com um sucesso, tentativas de <i>detectar arcano<\/i> no ser ou no item sofrem uma penalidade de -2 ou -4 com uma ampliação. Se <i>detectar arcano<\/i> falhar, a personagem não pode ver através desta conjuração e não está ciente do ocultamento a menos que se apresente uma evidência óbvia (tal como um ataque de um oponente invisível)."], "mods": [{"name": "Forte", "epic": false, "desc": ["<i>Ocultar<\/i> apenas. Rolagens de detecção para ver através do ocultamento passam a ser feitas com -4 com um sucesso e -6 com uma ampliação."], "cost": "+1"}, {"name": "Identificar", "epic": false, "desc": ["Quem conjura pode identificar os poderes mágicos de um item e como funciona."], "cost": "+1"}, {"name": "Receptores Adicionais", "epic": false, "desc": ["Para cada Ponto de Poder adicional, é possível afetar um novo espectador para <i>Detectar<\/i>, ou item para <i>Ocultar<\/i>."], "cost": "+1"}, {"name": "Sentir Alinhamento", "epic": false, "desc": ["Quem conjura pode sentir a presença e exata localização de bem ou mal sobrenatural dentro do alcance. <i>Detectar arcano<\/i> ativado com <i>Sentir Alinhamento<\/i> não requer linha de visão para localizar criaturas."], "cost": "+1"}, {"name": "Área", "epic": false, "desc": ["<i>Ocultar<\/i> apenas. O poder afeta tudo em uma esfera do tamanho de um Modelo Médio de Explosão por +1 ponto, ou um Modelo Grande de Explosão por +2."], "cost": "+1/+2"}], "page": 193, "tabelas": [], "notas": [], "resumo": "Detecta magia por Duração 5 ou oculta por 1 hora."}, {"nome": "Desejo", "stats": {"estagio": "Lendário", "pp": "20", "dist": "Astúcia", "dur": "Instantânea", "escola": "Universal", "manif": "Um gênio na garrafa, bater os sapatos, um encantamento, uma pata de macaco."}, "body": ["<i>Desejo<\/i> permite que a personagem dobre a realidade à sua vontade. Entretanto, é custoso alterar a realidade, então quem conjura deve sacrificar permanentemente 3 de seus Pontos de Poder (após o feitiço ser conjurado). Uma ampliação na rolagem da perícia arcana remove esse custo.", "É possível escolher um dos efeitos a seguir por conjuração, escolhido antes da rolagem ser feita:", "ATIVAR UM PODER: <i>Desejo<\/i> conjura qualquer outro poder disponível, incluindo modificadores, disponíveis na campanha com uma ampliação. Se o feitiço for resistido, o alvo rola com uma penalidade de -2 além de quaisquer outros modificadores. Se os Pontos de Poder necessários para ativar o poder e os modificadores forem maiores que o custo de <i>desejo<\/i>, quem conjura deve pagar a diferença.", "AUMENTAR UMA CARACTERÍSTICA: <i>Desejo<\/i> pode aumentar permanentemente uma Característica em um tipo de dado. Isso também aumenta o limite da Característica em um tipo de dado. O receptor nunca pode ter uma Característica aumentada mais de uma vez por desejo.", "ESPECIAL: É possível mudar um aspecto menor de si mesmo, de outros ou do mundo ao seu redor (se o alvo do desejo não quer ser afetado, resiste com uma rolagem de Espírito -2). Isso não pode causar mudanças amplas ao mundo ou história, não deve ser coberto por uma das habilidades acima e fica completamente a cargo do Mestre de Jogo. Pode mudar o sexo, ancestralidade, idioma etc., mas estas mudanças não alteram o tempo e não são retroativas.", "<i>Desejo<\/i> pode melhorar o humor de alguém (e sua atitude na Tabela de Reação, se apropriado), mas não pode afetar permanentemente o livre arbítrio. Não pode forçar a mudança de opinião ou fazer alguém ferir a si mesmo.", "GANHAR UMA VANTAGEM: Ganha (ou concede a outro) uma Vantagem permanentemente. O receptor deve atender aos Requisitos da Vantagem e não pode ganhar mais de uma Vantagem por desejo.", "INTERVENÇÃO: Deseja alguma forma de ajuda, que normalmente aparece após algum período curto de tempo. Um grupo preso em uma masmorra desmoronada pode desejar escapar sendo resgatado por um grupo de anões mineiros. É possível desejar saber o verdadeiro nome de um poderoso demônio e no dia seguinte ser contatado por um subordinado traidor da criatura.", "RESTAURAR DESTINO: A personagem e todos os Cartas Selvagens dentro da Distância podem recuperar seus Benes até o seu máximo inicial.", "RIQUEZA: Pode desejar bens no valor de 10.000 po incluindo qualquer coisa desde um transporte a suprimentos e itens mágicos. Tais bens normalmente podem ser vendidos por um quarto de seu valor. A riqueza não aparece do nada, mas surge de eventos criados pelo Mestre.", "VER O FUTURO: É possível espiar o futuro próximo ou distante. Uma olhada no futuro próximo garante três marcadores de Convicção que devem ser usados por quem conjurou ou por alguém com quem teve contato (mental, verbal, visual etc.) nas próximas cinco rodadas. No final da quinta rodada, quaisquer marcadores restantes devem ser descartados. Uma olhada no futuro distante permite perguntar ao Mestre uma questão sobre o futuro e receber uma resposta tão precisa quando possível. Porém, ações do conjurador podem mudar o futuro, então é mais provável que isso seja usado para dar um caminho ou avisar de perigos futuros.", "VIAJAR PELO TEMPO: É possível viajar no tempo por um curto período: um minuto fora de combate ou voltar para o início da rodada atual do combate. Tudo que aconteceu neste período é revertido, exceto os Pontos de Poder, Benes e Ferimentos de quem conjurou.", "O Mestre deve fazer o melhor para lembrar aos outros o estado das coisas no início da rodada, mas alterar o tempo é imperfeito então não se preocupe em tudo estar exatamente igual.", "Uma vez revertido, apenas quem conjurou lembra da sequência alternativa de eventos e aquele período não pode ser alterado novamente."], "mods": [], "page": 194, "tabelas": [], "notas": [], "resumo": "Escolha um de vários eventos que alteram a realidade."}, {"nome": "Devastação", "stats": {"estagio": "Novato", "pp": "2", "dist": "Astúcia", "dur": "Instantânea", "escola": "Evocação", "manif": "Redemoinho, espírito caótico, campo de repulsão."}, "body": ["Esta habilidade cria caos e destruição para todos aqueles na área de efeito, arremessando detritos e rivais para todas as direções.", "Com um sucesso, quem conjura coloca um Modelo Médio de Explosão em qualquer lugar dentro do alcance do feitiço (Distância), ou um Modelo de Cone emanando de si (veja <b>Ataques de Área<\/b>, página 137).", "Qualquer pessoa tocada pelo modelo fica em Estado Distraído e deve <i>então<\/i> fazer uma rolagem de Força (com -2 se o poder foi conjurado com uma ampliação). Quem falha é arremessado 2d6 quadros – diretamente para longe de quem conjurou o poder se estiver usando um Modelo de Cone, ou para longe do centro de ação do poder se estiver usando um Modelo de Explosão (para aqueles que estão bem no centro, quem conjurou escolhe a direção para qual são arremessados).", "Vítimas que atingem um objeto duro (como uma parede) recebem 2d4 de dano (não letal a menos que seja uma parede com espinhos ou outro risco mais perigoso).", "<b>Alvos Aéreos:<\/b> Alvos aéreos ou que estão voando sofrem uma penalidade adicional de -2 em suas rolagens de força já que não têm um chão para se agarrar."], "mods": [{"name": "Área", "epic": false, "desc": ["<i>Devastação<\/i> afeta um Modelo", "Grande de Explosão."], "cost": "+1"}, {"name": "Devastação Melhorada", "epic": true, "desc": ["Alvos são arremessados 3d6 quadros e recebem", "2d6 de dano se atingirem um objeto duro."], "cost": "+2"}], "page": 195, "tabelas": [], "notas": [], "resumo": "Alvos dentro de um Modelo Médio de Explosão ou Cone ficam em Estado Distraído e podem sofrer arremessos."}, {"nome": "Disfarce", "stats": {"estagio": "Experiente", "pp": "2", "dist": "Astúcia", "dur": "10 minutos", "escola": "Ilusão", "manif": "Traços maleáveis, aparência"}, "body": ["ilusória, cabelo com um formato diferente.", "<i>Disfarce<\/i> permite que o alvo assuma a aparência de outra pessoa do mesmo Tamanho e formato, incluindo roupas. Não concede nenhuma habilidade, entretanto.", "Aqueles que têm um motivo para questionar sua identidade fazem uma rolagem de Perceber com -2 para enxergar através do <i>disfarce<\/i> (-4 com uma ampliação na rolagem de conjuração). Isto é uma ação livre."], "mods": [{"name": "Receptores Adicionais", "epic": false, "desc": ["O poder afeta um novo alvo para cada Ponto de Poder adicional."], "cost": "+1"}, {"name": "Tamanho", "epic": false, "desc": ["Permite assumir a forma de alguém até dois Tamanhos maior ou menor."], "cost": "+1"}], "page": 196, "tabelas": [], "notas": [], "resumo": "Alvo se parece com outra pessoa."}, {"nome": "Dissipar", "stats": {"estagio": "Novato", "pp": "1", "dist": "Astúcia", "dur": "Instantânea", "escola": "Abjuração", "manif": "Aceno de mãos, palavras sussurradas."}, "body": ["<i>Dissipar<\/i> permite que alguém anule poderes inimigos. Não tem efeito em encantamentos permanentes ou habilidades inatas como o sopro de um dragão ou o uivo de uma banshee. <i>Dissipar<\/i> afeta dispositivos arcanos normalmente (veja <b>Dispositivos Arcanos<\/b>, página 180).", "<i>Dissipar<\/i> pode ser usado em um poder já em efeito ou para contra-atacar um poder inimigo enquanto ele está sendo usado. O último requer que a pessoa contra-atacando esteja Aguardando e interrompa a ação inimiga.", "Em ambos os casos <i>dissipar<\/i> o poder de oponentes é uma rolagem resistida de perícias arcanas. Um alvo usando a Vantagem <b>Poderes Místicos<\/b> ou <b>Poderes Inatos<\/b> (veja a página 253) usa Espírito como sua perícia arcana.", "Se quem está <i>dissipando<\/i> vencer, o poder alvo encerra imediatamente (ou falha se foi contra-atacado com os resultados normais de falha). Com uma ampliação quem estava usando o poder <i>dissipado<\/i> também fica Distraído."], "mods": [{"name": "Área", "epic": false, "desc": ["O efeito cobre uma área: +1 Pontos de Poder usa um Modelo Pequeno de Explosão, +2 usa um Médio e +3 um Grande. Quem conjura deve fazer uma rolagem de perícia arcana, então cada alvo afetado faz uma rolagem resistida. Isso afeta todos os poderes na área alvo a menos que quem conjurou também use o Modificador Seletivo."], "cost": "+1/+2/+3"}, {"name": "Campo Anti-Magia", "epic": true, "desc": ["Em vez de afetar um poder à Distância, este modificador cria um Modelo Médio de Explosão centrado no receptor e com Duração 5. Itens, efeitos e poderes mágicos não têm efeito dentro do campo. Criaturas invocadas no campo devem fazer uma rolagem de Espírito a cada rodada ou sofrem um Ferimento. Objetos criados magicamente não são afetados. Campo Anti-Magia não afeta divindades ou artefatos e não pode ser combinado com qualquer outro modificador."], "cost": "+8"}, {"name": "Desencantar", "epic": false, "desc": ["Quem conjura pode afetar um item mágico em vez de um indivíduo ou poder. Isso é uma rolagem padrão de perícia arcana, não uma rolagem resistida, (Mestres podem aplicar uma penalidade para itens ou artefatos poderosos). Se bem-sucedido, todas as habilidades mágicas do item são anuladas por uma rodada, duas com uma ampliação."], "cost": "+1"}, {"name": "Múltiplos Poderes", "epic": false, "desc": ["Se bem-sucedido, quem conjura <i>dissipa<\/i> todos os poderes ativos do alvo."], "cost": "+3"}], "page": 196, "tabelas": [], "notas": [], "resumo": "Nega efeitos mágicos."}, {"nome": "Drenar Pontos de Poder", "stats": {"estagio": "Veterano", "pp": "2", "dist": "Astúcia", "dur": "Instantânea", "escola": "Necromancia", "manif": "Prece, palavras sussurradas, gestos."}, "body": ["Esta habilidade é usada para drenar a energia arcana de oponentes. Com uma ampliação é possível até mesmo sugar a energia roubada para uso próprio.", "O poder é resistido pelo Espírito do alvo e, se o alvo tiver um Antecedente Arcano diferente, o conjurador sofre uma penalidade de -2 em sua rolagem.", "Sucesso drena 1d6 Pontos de Poder de rivais (se houver e a rolagem não gerar Ases). Com uma ampliação os pontos drenados são adicionados aos próprios pontos de poder. Isso <i>pode<\/i> levar acima do seu máximo normal! Eles duram até serem usados e devem ser os primeiros gastos em uma conjuração.", "<i>Drenar Pontos de Poder<\/i> também pode ser usado em um dispositivo arcano (quem criou ainda resiste com sua perícia arcana, esteja portando-o ou não). O dispositivo não pode perder mais Pontos de Poder do que tem."], "mods": [{"name": "Poder", "epic": false, "desc": ["Quem conjura drena 2d6 Pontos de Poder com um sucesso."], "cost": "+2"}], "page": 197, "tabelas": [], "notas": [], "resumo": "Drena d6 Pontos de Poder de alguém, se bem-sucedido em uma rolagem resistida de perícias arcanas."}, {"nome": "Elo Mental", "stats": {"estagio": "Novato", "pp": "1", "dist": "Astúcia", "dur": "30 minutos", "escola": "Adivinhação", "manif": "Tiaras, talismãs de divindades."}, "body": ["<i>Elo mental<\/i> cria uma conexão telepática entre dois indivíduos (que não necessariamente deve incluir a personagem conjuradora). O elo acomoda apenas indivíduos dispostos e comunicação intencional — pensamentos que não são transmitidos conscientemente não são repassados.", "Uma vez ativado, a Distância entre todas as mentes conectadas é de até um quilômetro e meio ou oito com uma ampliação.", "Se qualquer uma das pessoas conectadas sofrer um Ferimento, quem mais estiver na conexão deve fazer uma rolagem de Astúcia ou fica em Estado Abalado (isso não pode causar um Ferimento).", "A velocidade da comunicação é a velocidade normal de fala, mas com uma ampliação membros podem se comunicar por até 30 segundos de fala em um único turno de combate."], "mods": [{"name": "Elo de Longa Distância", "epic": true, "desc": ["Quem conjura pode conectar qualquer mente com que é familiar que esteja no mesmo plano de existência, independente da distância."], "cost": "+3"}, {"name": "Receptores Adicionais", "epic": false, "desc": ["poder afeta um novo alvo para cada Ponto de Poder adicional."], "cost": "+1"}, {"name": "Transmissão", "epic": true, "desc": ["Quem conjura pode transmitir uma mensagem telepática para cada mente senciente dentro de um raio igual a Astúcia x4 (Astúcia x8 com uma ampliação). Só é possível transmitir, não é possível receber respostas."], "cost": "+2"}], "page": 197, "tabelas": [], "notas": [], "resumo": "Elo mental dentro de um quilômetro e meio (8 km com uma ampliação)."}, {"nome": "Empatia", "stats": {"estagio": "Novato", "pp": "1", "dist": "Astúcia", "dur": "5", "escola": "Encantamento", "manif": "Concentração, um sorriso acolhedor ou simpático, uma gentileza."}, "body": ["Uma rolagem bem-sucedida de perícia arcana contra Espírito dá a quem conjura ciência das emoções básicas do alvo. Isso lhe dá +1 (+2 com uma ampliação) em todas as rolagens de Intimidar, Persuadir, Performance ou Provocar contra esse alvo pela duração do poder. Este bônus não se aplica para rolagens de perícias feitas para ativar poderes.", "<i>Empatia<\/i> também funciona com animais, adicionando +1 (+2 com uma ampliação) em Cavalgar ou outras rolagens usadas para interagir com a criatura."], "mods": [{"name": "Duração", "epic": false, "desc": ["Duração é medida em minutos em vez de rodadas. Se a personagem Falha Criticamente qualquer rolagem das perícias afetadas contra o alvo, o efeito termina imediatamente."], "cost": "+1"}, {"name": "Encantar", "epic": false, "desc": ["Se o alvo é Não Cooperativo ou Neutro, um sucesso o torna Cooperativo ou Amigável com uma ampliação. O poder é instantaneamente quebrado se quem conjurou ou aliados atacam a vítima e seus companheiros."], "cost": "+2"}, {"name": "Receptores Adicionais", "epic": false, "desc": ["O poder afeta um novo alvo para cada Ponto de Poder adicional."], "cost": "+1"}, {"name": "Verdade", "epic": true, "desc": ["Quem conjura sabe se o alvo acredita que está dizendo a verdade ou não."], "cost": "+2"}], "page": 198, "tabelas": [], "notas": [], "resumo": "Rolagem resistida contra Espírito para adicionar +2 a ataques sociais pela Duração do poder."}, {"nome": "Enredar", "stats": {"estagio": "Novato", "pp": "2", "dist": "Astúcia", "dur": "Instantânea", "escola": "Transmutação", "manif": "Bomba de cola, vinhas, teias."}, "body": ["<i>Enredar<\/i> permite que o conjurador prenda um alvo com gelo, faixas de energia ou outras Manifestações tipo vinhas (Dureza 8). Se bem-sucedido, o alvo fica Enredado. Com uma ampliação, fica Preso.", "Vítimas podem se libertar no seu turno como detalhado em <b>Preso e Enredado<\/b> na página 146."], "mods": [{"name": "Área", "epic": false, "desc": ["Por +2 pontos o poder afeta quem estiver dentro de um Modelo Médio de Explosão. Por +3 pontos a área de efeito é aumentada para um Modelo Grande de Explosão ou use o Modelo de Raio."], "cost": "+2/+3"}, {"name": "Dano", "epic": false, "desc": ["Alvos enredados recebem 2d4 de dano no fim de seu turno."], "cost": "+2"}, {"name": "Forte", "epic": false, "desc": ["O material que está <i>enredando<\/i> é particularmente resistente. A Dureza é aumentada para 10."], "cost": "+2"}, {"name": "Mortal", "epic": true, "desc": ["Alvos enredados recebem", "2d6 de dano no fim de seu turno."], "cost": "+4"}], "page": 198, "tabelas": [], "notas": [], "resumo": "Prende ou Enreda inimigos."}, {"nome": "Explosão", "stats": {"estagio": "Experiente", "pp": "3", "dist": "Astúcia x2", "dur": "Instantânea", "escola": "Evocação", "manif": "Chuva de fogo, gelo, luz, escuridão, raios coloridos, enxame de insetos."}, "body": ["<i>Explosão<\/i> lança uma bola explosiva de energia ou matéria. A área de efeito é um Modelo Médio de Explosão. Todas as pessoas dentro do alvo sofrem 2d6 de dano, ou 3d6 com uma ampliação (veja <b>Ataques de Área<\/b>, página 137)."], "mods": [{"name": "Área", "epic": false, "desc": ["Quem está conjurando pode focar a <i>explosão<\/i> em um Modelo", "Pequeno de Explosão sem custo extra, ou em um Modelo Grande de Explosão por +1."], "cost": "+0/+1"}, {"name": "Dano", "epic": false, "desc": ["A <i>explosão<\/i> causa 3d6 de dano,", "4d6 com uma ampliação."], "cost": "+2"}, {"name": "Explosão Melhorada", "epic": false, "desc": ["A <i>explosão<\/i> causa 4d6 de dano (5d6 com uma ampliação)", "e é considerada Arma Pesada."], "cost": "+4"}], "page": 198, "tabelas": [], "notas": [], "resumo": "2d6 de dano em um Modelo Médio de Explosão."}, {"nome": "Falar Idioma", "stats": {"estagio": "Novato", "pp": "1", "dist": "Astúcia", "dur": "10 minutos", "escola": "Adivinhação", "manif": "Palavras, imagens, movimentos"}, "body": ["manuais.", "Esse poder permite falar, ler e escrever um idioma sapiente que não seja o seu. Uma ampliação na rolagem da perícia arcana permite que o usuário também entenda e use apropriadamente gírias e dialetos."], "mods": [{"name": "Entendimento em Massa", "epic": true, "desc": ["O receptor faz com que personagens à Astúcia x2 se entendam mutuamente, independente do idioma."], "cost": "+5"}, {"name": "Falar Idioma Melhorado", "epic": true, "desc": ["O receptor pode falar, ler e escrever todos os idiomas sapientes de uma vez."], "cost": "+2"}, {"name": "Receptores Adicionais", "epic": false, "desc": ["O poder afeta um novo alvo para cada Ponto de Poder adicional."], "cost": "+1"}], "page": 199, "tabelas": [], "notas": [], "resumo": "Quem utiliza pode falar e compreender idiomas."}, {"nome": "Fantoche", "stats": {"estagio": "Veterano", "pp": "3", "dist": "Astúcia", "dur": "5", "escola": "Encantamento", "manif": "Olhos brilhantes, estado similar ao transe, um relógio de bolso balançando, bonecos de vodu."}, "body": ["<i>Fantoche<\/i> é uma rolagem resistida de perícia arcana contra o Espírito do alvo. Com um sucesso a vítima obedece comandos que não firam a si mesma e pessoas com quem ela se importa. Isso também inclui inação, então uma personagem controlada não ficaria sem fazer nada ou deixaria o local se souber que seus amigos estão em perigo.", "Com uma ampliação, o alvo irá ferir a si mesmo ou outros (incluindo inação), mas ganha uma rolagem de Espírito como rolagem livre. Se bem-sucedido, não executa aquele comando específico, mas se mantém sob controle do conjurador. Com uma ampliação, escapa do domínio e o poder se encerra.", "Comandos são gerais como “ataque aquela pessoa” ou “abra aquela porta”. Não é possível ditar quantas ações a vítima usa em um turno, se usa ou não a Vantagem Varredura etc."], "mods": [{"name": "Forte", "epic": false, "desc": ["Rolagens de Espírito para resistir aos comandos são feitas com -2. Se quem conjura também usar <i>elo mental<\/i> no alvo, é possível estender seu controle a qualquer distância, até mesmo fora de vista."], "cost": "+2"}, {"name": "Receptores Adicionais", "epic": false, "desc": ["É possível afetar outras pessoas ao custo de 2 Pontos de Poder para cada alvo adicional."], "cost": "+2"}], "page": 199, "tabelas": [], "notas": [], "resumo": "Rolagem resistida contra Espírito para controlar o alvo."}, {"nome": "Ferir", "stats": {"estagio": "Novato", "pp": "2", "dist": "Astúcia", "dur": "5", "escola": "Transmutação", "manif": "Um brilho colorido, runas, símbolos, energia faiscante, farpas crescem da lâmina."}, "body": ["Este poder é conjurado em uma arma de algum tipo. Se for uma arma de combate à distância, afeta 20 virotes, ou flechas ou uma “carga” inteira de munição (Mestres determinam qual é a quantidade exata para armas incomuns). Enquanto o poder estiver ativo, o dano da arma é aumentado em +2 ou +4 com uma ampliação.", "<b>Limitações:<\/b> No caso de <i>ferir<\/i> com uma <b>Limitação Pessoal<\/b> (veja a página 176), “Pessoal” se refere a uma arma específica."], "mods": [{"name": "Ferir Melhorado", "epic": true, "desc": ["O dano da arma é aumentado em +4, ou +6 com uma ampliação e é considerado Arma Pesada."], "cost": "+2"}, {"name": "Receptores Adicionais", "epic": false, "desc": ["O poder afeta um novo alvo para cada Ponto de Poder adicional."], "cost": "+1"}], "page": 200, "tabelas": [], "notas": [], "resumo": "Aumenta o dano da arma em +2/+4."}, {"nome": "Ilusão", "stats": {"estagio": "Novato", "pp": "3", "dist": "Astúcia", "dur": "5", "escola": "Ilusão", "manif": "Feitiços mágicos, hologramas, “materializadores etéreos”."}, "body": ["Um dos maiores poderes desta habilidade é criar algo do nada – mesmo que não seja real!", "<i>Ilusão<\/i> é um poder que pode ser usado para criar uma cena ou réplica de quase tudo que você puder imaginar, mas é silencioso, intangível e incapaz de afetar o mundo real. Por exemplo, armas ilusórias passam através de oponentes, uma pessoa não pode se sentar em uma cadeira ilusória e um cão ilusório não tem um latido audível.", "Personagens que entram em contato com uma <i>ilusão<\/i> ou duvidam de que ela seja real, fazem uma rolagem de Astúcia como uma ação livre (com -2 se o poder foi ativado com uma ampliação). Se bem-sucedido, aquele indivíduo não está mais sujeito à conjuração.", "Mestres devem fazer rolagens em grupo para Extras enquanto apontam as inconsistências da <i>ilusão<\/i> entre si.", "O volume da <i>ilusão<\/i> deve caber dentro de uma esfera com o tamanho de um Modelo Médio de Explosão (diâmetro de 4 quadros ou oito metros)."], "mods": [{"name": "Área", "epic": false, "desc": ["A área que a ilusão afeta é aumentada para o tamanho de um Modelo Grande de Explosão."], "cost": "+1"}, {"name": "Duração", "epic": true, "desc": ["A Duração é medida em minutos."], "cost": "+2"}, {"name": "Forte", "epic": false, "desc": ["Rolagens de Astúcia feitas para desacreditar na <i>ilusão<\/i> são feitas com -2."], "cost": "+2"}, {"name": "Ilusão Mortal", "epic": true, "desc": ["A ilusão pode atacar ou causar mal. Quem conjura pode usar suas ações para fazer a ilusão “atacar” um indivíduo. Isso é uma rolagem resistida da perícia arcana de quem conjura contra a Astúcia do alvo (-2 se o poder foi ativado com uma ampliação).", "Se quem conjura vencer, o alvo está Abalado (isso não pode causar Incapacitação). Com uma ampliação o alvo sofre um Ferimento (isso pode causar Incapacitação). É possível atacar alvos adicionais com Ações Múltiplas. Não é possível usar outras manobras de combate como Ataques Localizados ou Ataques Selvagens (embora possa parecer que sim!)"], "cost": "+3"}, {"name": "Mobilidade", "epic": false, "desc": ["Por +1 Ponto de Poder a ilusão pode se mover (e voar) com Movimentação 12, ou 24 por +2 Pontos de Poder. Isso é uma ação livre limitada."], "cost": "+1/+2"}, {"name": "Som", "epic": false, "desc": ["O poder gera som apropriado para a <i>ilusão<\/i>. Aliados ilusórios podem falar, corvos ilusórios crocitam e assim por diante. Contudo, não pode mascarar ou abafar sons existentes."], "cost": "+1"}], "page": 201, "tabelas": [], "notas": [], "resumo": "Cria uma cena visual ou réplica da maioria das coisas que pode imaginar."}, {"nome": "Iluminar/Obscurecer", "stats": {"estagio": "Novato", "pp": "2", "dist":
