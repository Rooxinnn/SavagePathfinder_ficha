 "Astúcia", "dur": "10 minutos", "escola": "Evocação", "manif": "Tocha ilusória, luz solar, escuridão, névoa espessa."}, "body": ["<i>Iluminar<\/i> cria uma iluminação intensa em um Modelo Grande de Explosão. Com uma ampliação, a luz também pode ser focada em um feixe de 5 quadros (10 metros).", "<i>Obscurecer<\/i> bloqueia iluminação em uma área do tamanho de um Modelo Grande de Explosão tornando a área coberta por Escuridão ou Escura como um Breu com uma ampliação (veja <b>Iluminação<\/b> na página 145).", "Se <i>iluminar<\/i> e <i>obscurecer<\/i> se sobrepuserem, eles criam uma faixa de Penumbra (-2)."], "mods": [{"name": "Área", "epic": true, "desc": ["Iluminar apenas. A luz se expande até um raio igual a Astúcia, com Distância de Astúcia x2. A luz é considerada luz solar natural."], "cost": "+2"}, {"name": "Escuridão Verdadeira", "epic": true, "desc": ["A escuridão bloqueia Infravisão, Visão na Penumbra e Visão no Escuro. Não tem efeito em visões mágicas como <i>detectar arcano.<\/i>"], "cost": "+2"}, {"name": "Móvel", "epic": false, "desc": ["Quem conjura pode mover o modelo com Movimentação igual a seu dado de perícia arcana como uma ação livre limitada a cada rodada. Também pode associar, no momento em que conjura, a área de efeito a um objeto inanimado. Não pode ser associado a um ser vivo."], "cost": "+1"}], "page": 201, "tabelas": [], "notas": [], "resumo": "Cria ou dissipa iluminação."}, {"nome": "Intangibilidade", "stats": {"estagio": "Veterano", "pp": "5", "dist": "Astúcia", "dur": "5", "escola": "Transmutação", "manif": "Forma fantasmagórica, corpo de sombras, transformação gasosa."}, "body": ["Com uma rolagem bem-sucedida na perícia arcana, quem receber este poder se torna incorpóreo. Torna-se incapaz de afetar o mundo físico e também não pode ser afetado pelo mesmo. Pode transpassar paredes e armas não-mágicas o atravessam. Quaisquer itens carregados na hora da conjuração também se tornam incorpóreos.", "Enquanto estiver dessa forma, pode afetar outras criaturas incorpóreas (incluindo a si) e ainda é suscetível a ataques sobrenaturais, incluindo poderes e itens encantados. Com uma ampliação na rolagem de ativação, reduza o dano de ataques sobrenaturais em 4.", "A criatura se torna corpórea quando o poder se encerra, mas se estiver dentro de alguém ou algo, ele é desviado para o espaço aberto mais próximo e recebe Atordoado.", "Se conjurado em um alvo relutante, a vítima resiste com Espírito. Se afetado, a vítima encerra o efeito com uma rolagem de Espírito com uma ação livre no final de seus turnos subsequentes."], "mods": [{"name": "Duração", "epic": true, "desc": ["Duração é medida em minutos em vez de rodadas."], "cost": "+3"}, {"name": "Receptores Adicionais", "epic": true, "desc": ["O poder afeta um novo alvo para cada 3 Pontos de Poder adicionais."], "cost": "+3"}], "page": 202, "tabelas": [], "notas": [], "resumo": "Alvo se torna incorpóreo."}, {"nome": "Invisibilidade", "stats": {"estagio": "Experiente", "pp": "5", "dist": "Astúcia", "dur": "5", "escola": "Ilusão", "manif": "Pó, poção, luzes fluorescentes."}, "body": ["Com um sucesso, a personagem e seus itens pessoais ficam transparentes, mas com um leve borrão ou contorno visível. Qualquer ação contrária que requeira visão é feita com -4 ou -6 com uma ampliação. A mesma penalidade se aplica a rolagens de Perceber para detectar a presença invisível.", "Reduza a penalidade em 2 se a posição da personagem invisível é descoberta, como, por exemplo, se mover na água, ser sujo com lama ou outra substância que revela sua forma, ficar na chuva etc."], "mods": [{"name": "Duração", "epic": true, "desc": ["A Duração do poder é mensurada em minutos em vez de rodadas. Se a personagem tentar um ataque que cause dano ou mirar em um alvo relutante com um poder, o efeito é encerrado imediatamente."], "cost": "+2"}, {"name": "Receptores Adicionais", "epic": false, "desc": ["O poder afeta um novo alvo para cada 3 Pontos de Poder adicionais."], "cost": "+3"}], "page": 202, "tabelas": [], "notas": [], "resumo": "Alvo fica invisível (-4/-6 para afetar)."}, {"nome": "Leitura de Objeto", "stats": {"estagio": "Experiente", "pp": "2", "dist": "Toque", "dur": "Especial", "escola": "Adivinhação", "manif": "Tocar o objeto, mãos brilhantes"}, "body": ["<i>Leitura de objeto<\/i> é a habilidade de ver o passado de um objeto inanimado. Com um sucesso, é possível ter uma impressão vaga ou algum tipo de informação que está procurando, da criação do objeto em diante. Uma ampliação garante informações mais específicas.", "Se quem conjura usa <i>leitura de objeto<\/i> em uma faca ensanguentada para investigar um assassinato, por exemplo, sucesso pode dizer que quem a usou foi um humano e o ataque ocorreu à noite. Com uma ampliação, pode ter um vislumbre da face do assassino ou alguma outra pista que revela sua identidade."], "mods": [{"name": "Projeção", "epic": true, "desc": ["É possível transmitir a visão, projetando-a no espaço do tamanho de um pequeno cômodo. Qualquer um presente pode ver e escutar os eventos e examinar a projeção de todos os ângulos."], "cost": "+2"}], "page": 202, "tabelas": [], "notas": [], "resumo": "Revela uma vaga impressão da história de um objeto (mais detalhes com uma ampliação)."}, {"nome": "Leitura Mental", "stats": {"estagio": "Novato", "pp": "2", "dist": "Astúcia", "dur": "Instantânea", "escola": "Adivinhação", "manif": "Invasão psiônica, visão da alma."}, "body": ["<i>Leitura mental<\/i> é uma rolagem resistida contra a Astúcia do alvo. Sucesso permite conseguir uma resposta sincera do alvo. O alvo fica ciente da invasão mental a menos que a pessoa fazendo a leitura consiga uma ampliação. Mestres podem aplicar modificadores com base nas Complicações mentais do indivíduo ou no atual estado emocional."], "mods": [{"name": "Andarilho da Mente", "epic": true, "desc": ["Quem conjura tem acesso maior à mente e às memórias do alvo, desbloqueando uma cena inteira ou cadeia de memórias conectadas (decisão do Mestre)."], "cost": "+2"}], "page": 202, "tabelas": [], "notas": [], "resumo": "Rolagem resistida contra Astúcia para ler a mente."}, {"nome": "Limpeza Mental", "stats": {"estagio": "Veterano", "pp": "3", "dist": "Astúcia", "dur": "Instantânea", "escola": "Encantamento", "manif": "Uma bebida tóxica, parasitas, tocar nas têmporas do alvo."}, "body": ["<i>Limpeza mental<\/i> remove as memórias de um alvo, uma violação terrível na maioria das sociedades civilizadas. O poder é resistido pela Astúcia da vítima e requer um minuto completo de embate mental. A vítima deve estar consciente durante este momento, então, se não estiver contida ela pode simplesmente sair da Distância.", "Se bem-sucedida, a vítima esquece um único evento (cerca de 30 minutos de tempo). Uma ampliação remove uma memória complexa de várias horas.", "Se o alvo vencer, a mesma pessoa não pode afetá-lo com <i>limpeza mental<\/i> por 24 horas (contudo, outras pessoas podem tentar novamente o poder).", "A memória continua desaparecida, mas fortes evidências que desafiem sua “lógica” permitem uma rolagem de Astúcia com -2 para lembrar de fragmentos determinados pelo Mestre."], "mods": [{"name": "Editar", "epic": false, "desc": ["Em vez de limpar a memória, permite editá-la como achar melhor."], "cost": "+1"}, {"name": "Conjuração Rápida", "epic": false, "desc": ["É possível limpar uma memória como uma ação."], "cost": "+2"}, {"name": "Limpeza Mental Melhorada", "epic": true, "desc": ["O efeito remove completamente um único evento, pessoa, lugar, coisa etc., da memória da vítima."], "cost": "+2"}], "page": 203, "tabelas": [], "notas": [], "resumo": "Remove e altera memórias."}, {"nome": "Localizar", "stats": {"estagio": "Novato", "pp": "3", "dist": "Pessoal", "dur": "10 minutos", "escola": "Adivinhação", "manif": "Um cristal planando sobre um mapa, mensagem nas nuvens, um raio de luz."}, "body": ["Algumas vezes é literalmente impossível localizar algo por meios mundanos. <i>Localizar<\/i> permite encontrar estas coisas escondidas.", "Quando este poder é conjurado, deve-se escolher um objeto, criatura ou localização. Se quem conjura nunca tiver visto o alvo, a rolagem é feita com -2. Um sucesso dá uma noção da direção geral e a distância do alvo. Uma ampliação também dá uma impressão do alvo (por exemplo, a criatura está adormecida, o objeto está em um cofre, a porta secreta está atrás de uma estante).", "<b>Água Corrente:<\/b> Em Golarion, água corrente bloqueia <i>localizar<\/i> se estiver entre quem conjura e o alvo."], "mods": [{"name": "Encontrar o Caminho", "epic": false, "desc": ["Além da direção e da distância até a pessoa, lugar ou coisa, quem conjura também tem uma noção sobrenatural da melhor forma ou maneira mais rápida de se chegar até a área do alvo."], "cost": "+1"}], "page": 203, "tabelas": [], "notas": [], "resumo": "Encontra um objeto."}, {"nome": "Maldição", "stats": {"estagio": "Experiente", "pp": "5", "dist": "Toque", "dur": "Especial", "escola": "Necromancia", "manif": "Efígie, palavras ritualísticas, toque."}, "body": ["Alguns praticantes das artes arcanas curam os seus aliados. Outros infligem doenças sobre os seus inimigos. Para usar este feitiço particularmente desagradável, a pessoa conjurando faz uma rolagem de perícia arcana resistida pela rolagem de Espírito da vítima. Falha significa que a vítima sofre um nível de Fadiga imediatamente e ao pôr-do-sol de cada dia seguinte (novos lançamentos de maldição não têm efeito adicional).", "Uma vez que a pessoa amaldiçoada fique Incapacitada, ela faz uma rolagem de Vigor todos os dias para evitar a morte.", "<b>Quebrando a Maldição:<\/b> A <i>maldição<\/i> pode ser cancelada à vontade pela pessoa que a lançou originalmente e termina automaticamente se ela for morta. <i>Dissipar<\/i> também remove uma <i>maldição<\/i> (com -2), embora cada indivíduo só possa tentar uma vez – se falhar, remover a maldição está além de suas habilidades."], "mods": [{"name": "Transformar em Pedra", "epic": true, "desc": ["Pessoas amaldiçoadas devem fazer uma rolagem de Espírito a cada rodada ou recebem um nível de Fadiga. Quando Incapacitada a vítima se transforma em pedra (sua Resistência se torna Dureza). A maldição deve ser quebrada para cessar o efeito."], "cost": "+5"}], "page": 203, "tabelas": [], "notas": [], "resumo": "Inflige uma maldição em um oponente."}, {"nome": "Manipulação Elemental", "stats": {"estagio": "Novato", "pp": "1", "dist": "Astúcia", "dur": "5", "escola": "Transmutação", "manif": "Alguns gestos simples."}, "body": ["Este poder concede controle básico sobre os quatro elementos tradicionais: ar, terra, fogo e água (os elementos podem variar de uma cultura para outra).", "Aqui estão algumas ideias do que cada elemento pode fazer. Cada uma é uma ação.", "AR: Empurrar alguém (For d6 ou d8 com uma ampliação), apagar uma tocha, abanar uma chama, refrescar alguém (rerrolagem de Fadiga num calor escaldante).", "FOGO: Conjurar uma chama do tamanho de uma tocha, atirar uma pequena explosão de fogo em alguém (2d4 de dano), espalhar uma chama já existente (veja <b>Fogo<\/b> na página 167).", "TERRA: Mover meio metro quadrado de terra (metade disso em pedra) a cada rodada, cobrir rastros arremessar rochas em um alvo a Distância com 2d4 de dano.", "ÁGUA: Conjurar um litro de água (não “dentro” de objetos ou pessoas), purificar duzentos e cinquenta mililitros de água por conjuração, empurrar alguém com um jato de água (For d6 ou d8 com uma ampliação)."], "mods": [{"name": "Clima", "epic": true, "desc": ["É possível convocar ou dissipar tempestades, trazer uma chuva refrescante, castigar a terra com uma onda de calor ou até mesmo trazer neve para os climas mais quentes.", "Quem conjura pode convocar ou dispersar chuva, neve, sol e vento em um raio de cerca de oito quilômetros. A severidade depende do ambiente local – um deserto escaldante pode receber uma chuva fraca enquanto que uma floresta tropical uma chuva torrencial. Os efeitos demoram 10 minutos para serem criados e duram uma hora."], "cost": "+5"}, {"name": "Poder", "epic": false, "desc": ["O volume do ar, terra, fogo ou água afetado é triplicado."], "cost": "+3"}], "page": 204, "tabelas": [], "notas": [], "resumo": "Permite a manipulação menor de elementos básicos."}, {"nome": "Medo", "stats": {"estagio": "Novato", "pp": "2", "dist": "Astúcia", "dur": "Instantânea", "escola": "Necromancia", "manif": "Energia sobrenatural, calafrios."}, "body": ["Este poder provoca medo e terror avassalador no alvo. O alvo faz uma rolagem de Medo. Extras que falharem ficam em Estado Apavorado e Cartas Selvagens rolam na <b>Tabela de Medo<\/b>. Se o poder for conjurado com uma ampliação, a rolagem de Medo é feita com -2 e Cartas Selvagens adicionam +2 nos resultados da <b>Tabela de Medo<\/b>."], "mods": [{"name": "Área", "epic": false, "desc": ["Por +2 pontos o poder afeta a todos dentro de um Modelo Pequeno ou Médio de Explosão (escolha de quem conjura). Por +3 pontos a área de efeito é aumentada para um Modelo Grande de Explosão."], "cost": "+2/+3"}, {"name": "Medo Melhorado", "epic": true, "desc": ["Rolagens de medo são feitas com -2 ou -4 com uma ampliação."], "cost": "+2"}], "page": 204, "tabelas": [], "notas": [], "resumo": "Provoca um Teste de Medo."}, {"nome": "Morosidade/Velocidade", "stats": {"estagio": "Experiente", "pp": "2", "dist": "Astúcia", "dur": "Instantâneo ( morosidade ); 5 ( velocidade )", "escola": "Transmutação", "manif": "Desacelerar o tempo, movimento borrado, uma faixa escorregadia de óleo ou gelo."}, "body": ["<i>Morosidade<\/i> diminui a celeridade e coordenação. Diminui à metade o movimento total do alvo em cada rodada (arredondado para cima). Com uma ampliação, o movimento também é uma ação. O alvo automaticamente tenta se livrar dos efeitos de <i>morosidade<\/i> no fim cada um dos seus próximos turnos fazendo uma rolagem de Espírito.", "<i>Velocidade<\/i> dobra o movimento do alvo (Movimentação padrão e corrida). Com uma ampliação a personagem também ignora a penalidade de corrida de -2."], "mods": [{"name": "Área", "epic": false, "desc": ["<i>Morosidade<\/i> apenas. Por +2 pontos o poder afeta a todos dentro de um Modelo Médio de Explosão. Por +3 pontos a área de efeito é aumentada para um Modelo Grande de Explosão."], "cost": "+2/+3"}, {"name": "Disparada", "epic": false, "desc": ["<i>Velocidade<\/i> apenas. O dado de corrida do receptor não é rolado – é usado o resultado máximo possível."], "cost": "+2"}, {"name": "Forte", "epic": false, "desc": ["<i>Morosidade<\/i> apenas. A rolagem de Espírito para se livrar do efeito de <i>morosidade<\/i> é feita com -2."], "cost": "+1"}, {"name": "Rapidez", "epic": false, "desc": ["<i>Velocidade<\/i> apenas. A penalidade total por Ações Múltiplas em cada turno é reduzida em 2 (pode realizar duas ações sem penalidades ou três ações com -2 em cada)."], "cost": "+2"}, {"name": "Receptores Adicionais", "epic": false, "desc": ["<i>Velocidade<\/i> apenas. O poder afeta um novo alvo para cada Ponto de Poder adicional."], "cost": "+1"}], "page": 204, "tabelas": [], "notas": [], "resumo": "Aumenta ou diminui movimento."}, {"nome": "Mudança de Forma", "stats": {"estagio": "Novato", "pp": "Especial", "dist": "Pessoal", "dur": "5", "escola": "Transmutação", "manif": "“Morfar”, talismãs, tatuagens."}, "body": ["Esse poder permite a quem conjura assumir a forma de um dos seguintes tipos de criatura: Animal, Elemental, Humanoide ou Planta. Só é possível assumir a forma básica da criatura, não uma versão de elite ou alternativa (então é possível se transformar em um Troll, mas não um Troll Brutamontes). Com uma ampliação é possível aumentar a Força e o Vigor da criatura em um tipo de dado cada.", "O Tamanho da nova forma é limitada pelo Estágio de quem conjura:", "Itens sendo segurados ou usados se fundem na forma assumida e reaparecem quando o poder acaba.", "Quem sofre a transformação mantém sua Astúcia, Espírito, Complicações, Vantagens e perícias associadas (embora talvez não consiga usar algumas ou todas elas, dependendo da forma – critério do Mestre). Ganha a Agilidade, Força, Vigor e perícias associadas da forma assumida e não pode usar dispositivos que requeiram a forma humanoide. Sua capacidade de se comunicar é limitada àquela da nova forma. Pode manter poderes ativados previamente e até mesmo conjurar novos se a forma permitir (decisão do Mestre). Conjurar um Poder na nova forma aplica uma penalidade de -2 na rolagem, modificada pela diferença de Estágio de quem conjura e do Estágio necessário para a nova forma (Veja a Tabela de Mudança de Forma). Se quem conjura é um Estágio maior, a penalidade é -1, ou 0 se dois Estágios maior.", "As habilidades naturais da criatura são conferidas, mas poderes inatos e Antecedentes Arcanos não. Alguém que assuma a forma de um dragão de bronze pode voar e usar a arma de sopro, mas não sua habilidade de conjurar.", "<b>Efeitos de Ferimentos:<\/b> Não é possível se beneficiar dos Ferimentos adicionais ou Habilidades que reduzam Ferimentos como Resiliente e Muito Resiliente ou Imparável, ou ainda de Ferimentos Extras de criaturas Grandes ou Enormes"], "mods": [{"name": "Duração", "epic": false, "desc": ["Duração é medida em minutos em vez de rodadas."], "cost": "+1"}, {"name": "Transformar", "epic": true, "desc": ["o poder pode afetar um alvo cooperativo à Distância de Toque por +2 ou Astúcia por +3 (o Modificador Distância pode aumentar isso ainda mais)."], "cost": "+2/+3"}], "page": 205, "tabelas": [{"titulo": "Tamanho máximo da nova forma", "cab": ["Custo", "Estágio", "Tamanho"], "linhas": [["3", "Novato", "Tamanho -4 a -1"], ["5", "Experiente", "Tamanho 0"], ["8", "Veterano", "Tamanho 1 a 2"], ["11", "Heroico", "Tamanho 3 a 4"], ["15", "Lendário", "Tamanho 5 a 10"]], "nota": ""}], "notas": [], "resumo": "Permite assumir a forma de várias criaturas."}, {"nome": "Parar o Tempo", "stats": {"estagio": "Heroico", "pp": "8", "dist": "Pessoal", "dur": "Instantânea", "escola": "Transmutação", "manif": "Uma ampulheta brilhante, partículas de gelo flutuantes, borrão."}, "body": ["Tempo é constante para a maioria, mas não para este conjurador. O feitiço diminui o tempo para tudo exceto quem o conjura, garantindo um novo turno imediatamente após terminar este. Com uma ampliação pode realizar até quatro ações em seu turno, em vez de três, e pode ignorar até 2 pontos de penalidades de Ações Múltiplas. <i>Parar o tempo<\/i> só pode ser conjurado uma vez por rodada."], "mods": [], "page": 205, "tabelas": [], "notas": [], "resumo": "Conjurador ganha um turno adicional (até 4 ações com uma ampliação)."}, {"nome": "Polimorfia Perniciosa", "stats": {"estagio": "Veterano", "pp": "3+2 por ponto de Tamanho alterado", "dist": "Astúcia", "dur": "5", "escola": "Transmutação", "manif": "Artefato amaldiçoado, um raio de energia."}, "body": ["Escolha uma criatura do tipo Animal, de tamanho -2 a 3. Polimorfia perniciosa é uma rolagem resistida pela perícia arcana de quem a conjura contra o Espírito do alvo. Com um sucesso a vítima se transforma em uma criatura relativamente inofensiva. Recebe a Agilidade, Força, Vigor e habilidades naturais do animal, mas mantém sua própria Astúcia e Espírito.", "O alvo deve ser capaz de sobreviver em seu ambiente atual enquanto estiver na nova forma (não é possível transformar alguém em um peixe em terra seca). Se a vítima falha criticamente na rolagem de Espírito, ela também recebe a Astúcia do animal, acreditando que <i>é<\/i> o animal até o poder se encerrar. No final de cada turno subsequente, a vítima faz uma rolagem de Espírito -2 (-4 se o conjurador conseguir uma ampliação) para retornar a sua forma natural."], "mods": [{"name": "Duração", "epic": true, "desc": ["A Duração do poder é mensurada em minutos em vez de rodadas."], "cost": "+2"}], "page": 206, "tabelas": [], "notas": [], "resumo": "Animal de Tamanho -2 a Tamanho 3 é transformado em uma criatura relativamente inofensiva."}, {"nome": "Proteção", "stats": {"estagio": "Novato", "pp": "2", "dist": "Astúcia", "dur": "5", "escola": "Abjuração", "manif": "Um brilho místico, pele enrijecida, armadura etérea ou mágica."}, "body": ["<i>Proteção<\/i> cria um campo de energia ou armadura em torno de alguém concedendo 2 pontos de Armadura. Com uma ampliação o bônus é aplicado diretamente na Resistência (e, portanto, imune a modificadores de Perfurante de Armadura).", "Se a <i>proteção<\/i> é visível ou não depende da Manifestação – isso fica a critério do conjurador.", "<i>Proteção<\/i> se acumula com outras armaduras naturais ou vestidas."], "mods": [{"name": "Receptores Adicionais", "epic": false, "desc": ["O poder pode afetar alvos adicionais ao custo de 1 Ponto de Poder cada."], "cost": "+1"}], "page": 206, "tabelas": [], "notas": [], "resumo": "Concede Armadura +2 com um sucesso, Resistência +2 com uma ampliação."}, {"nome": "Proteção Ambiental", "stats": {"estagio": "Novato", "pp": "2", "dist": "Astúcia", "dur": "Uma hora", "escola": "Abjuração", "manif": "Uma marca na testa, poções, guelras."}, "body": ["Personagens algumas vezes viajam debaixo d’água, através de planos de fogo ou em outros ambientes perigosos. Este poder lhes protege das profundezas esmagadoras, do calor escaldante, frio intenso e até mesmo da radiação.", "<i>Proteção ambiental<\/i> permite que o alvo respire, fale e se mova com sua Movimentação normal em um ambiente que seria fatal. Sob o efeito da magia, a pessoa está protegida do calor intenso, frio, radiação, pressão e falta de oxigênio.", "Uma ampliação aumenta a Duração para oito horas."], "mods": [{"name": "Receptores Adicionais", "epic": false, "desc": ["O poder afeta um novo alvo para cada Ponto de Poder adicional."], "cost": "+1"}, {"name": "Resistência Ambiental", "epic": false, "desc": ["O poder agora oferece resistência ambiental, reduzindo o dano de uma fonte de energia (fogo, frio, eletricidade etc.) em 4 pontos (6 com uma ampliação)."], "cost": "+1"}], "page": 206, "tabelas": [], "notas": [], "resumo": "Protege o alvo contra ambientes perigosos."}, {"nome": "Proteção Arcana", "stats": {"estagio": "Novato", "pp": "1", "dist": "Astúcia", "dur": "5", "escola": "Abjuração", "manif": "Concentração, brilho opaco em torno da pessoa protegida, um talismã"}, "body": ["Sucesso com <i>proteção arcana<\/i> significa que poderes hostis sofrem uma penalidade de -2 (-4 com uma ampliação) para afetar a pessoa protegida. Se o poder causar dano, ele sofre a mesma redução.", "<i>Proteção Arcana<\/i> acumula com Resistência Arcana, caso a pessoa protegida tenha ambas!"], "mods": [{"name": "Proteção Arcana Melhorada", "epic": true, "desc": ["Poderes hostis sofrem uma penalidade de -4", "(-6 com uma ampliação)."], "cost": "+2"}, {"name": "Receptores Adicionais", "epic": false, "desc": ["O poder afeta um novo alvo para cada Ponto de", "Poder adicional."], "cost": "+1"}], "page": 206, "tabelas": [], "notas": [], "resumo": "Oponentes subtraem 2 (4 com uma ampliação) quando miram nessa personagem; reduz o dano em igual quantidade."}, {"nome": "Raio", "stats": {"estagio": "Novato", "pp": "1", "dist": "Astúcia x2", "dur": "Instantânea", "escola": "Evocação", "manif": "Fogo, gelo, luz, trevas, raios coloridos, uma torrente de insetos."}, "body": ["<i>Raio<\/i> lança rajadas de energia que causam dano, faixas de luz sagrada ou fragmentos de matéria em direção a quem recebe.", "Na há penalidades por Distância, mas a rolagem da perícia arcana é afetada por", "Cobertura, Iluminação e todas as outras penalidades habituais de um ataque à distância.", "O dano do <i>raio<\/i> é 2d6 ou 3d6 com uma ampliação."], "mods": [{"name": "Cadência", "epic": true, "desc": ["O ataque com <i>raio<\/i> é feito com Cadência 2."], "cost": "+2"}, {"name": "Dano", "epic": false, "desc": ["O <i>raio<\/i> causa 3d6 de dano (4d6 com uma ampliação)."], "cost": "+2"}, {"name": "Desintegrar", "epic": true, "desc": ["Se o <i>raio<\/i> Incapacita uma criatura, ela deve fazer uma rolagem de Vigor ou seu corpo se torna pó. Se o alvo é um objeto, quem conjurou rola dano contra sua Dureza como de costume (veja <b>Quebrando Coisas<\/b> na página 147). Se o <i>raio<\/i> quebra um objeto, ele se desintegra. Desintegrar permite que conjuradores rolem o bônus de dano contra objetos e todos os dados de dano podem abrir Ases.", "<b>Itens Encantados:<\/b> A Dureza de itens encantados é o dobro para a mecânica de desintegração."], "cost": "+2"}, {"name": "Raio Maior", "epic": true, "desc": ["O <i>raio<\/i> causa 4d6 de dano (5d6 com uma ampliação) e é considerado Arma Pesada."], "cost": "+4"}], "page": 207, "tabelas": [], "notas": [], "resumo": "Ataque à distância de 2d6 de dano."}, {"nome": "Rajada", "stats": {"estagio": "Novato", "pp": "2", "dist": "Modelo de Cone ou de Raio", "dur": "Instantânea", "escola": "Evocação", "manif": "Uma chuva de chamas, luz, outra matéria ou energia."}, "body": ["<i>Rajada<\/i> produz um amplo leque de energia que banha seus alvos em chamas incandescentes, outra matéria ou energia destrutiva.", "Sucesso cria um Modelo de Cone ou de Raio começando em quem conjurou e se estendendo para fora (veja <b>Ataques de Área<\/b>, página 137). Todas as pessoas dentro do modelo sofrem 2d6 de dano (ou 3d6 com uma ampliação)."], "mods": [{"name": "Dano", "epic": false, "desc": ["A <i>rajada<\/i> causa 3d6 de dano, 4d6 com uma ampliação."], "cost": "+2"}, {"name": "Rajada Melhorada", "epic": true, "desc": ["A <i>rajada<\/i> causa 4d6 de dano (5d6 com uma ampliação) e é considerada Arma Pesada."], "cost": "+4"}], "page": 208, "tabelas": [], "notas": [], "resumo": "Ataque em forma de cone causando 2d6 de dano."}, {"nome": "Ressurreição", "stats": {"estagio": "Heroico", "pp": "20", "dist": "Toque", "dur": "Instantânea", "escola": "Invocação", "manif": "Cerimônias elaboradas, amuletos mágicos, intervenção divina"}, "body": ["Talvez o maior poder de todos seja a habilidade de trazer alguém de volta dos mortos. Pode restaurar entes queridos, trazer consolo para quem está de luto e derrubar reinos.", "Trazer os mortos de volta à vida requer um cadáver razoavelmente completo cuja morte tenha se passado há no máximo um ano. Quem executa, ao longo de quatro horas, reza, medita, canta ou se concentra de alguma outra forma em reparar o corpo e trazer o espírito de volta para ele.", "Ao final do processo, faz uma rolagem de conjuração com -4. Se bem-sucedido, a vítima volta à vida com três Ferimentos e está Exausta. Com uma ampliação, ela retorna meramente Exausta."], "mods": [{"name": "Poder", "epic": false, "desc": ["A pessoa pode trazer um espírito morto há até uma década por +5 Pontos de Poder."], "cost": "+5"}, {"name": "Ressurreição Melhorada", "epic": true, "desc": ["Os limites da vida e da morte não importam mais. É possível restaurar o morto à vida independente de quanto tempo o alvo estava morto e até mesmo sem um corpo. Para ressuscitar o morto desta forma é necessário um ritual de doze horas, que deixa quem o conjura Exausto."], "cost": "+10"}], "page": 208, "tabelas": [], "notas": [], "resumo": "Traz os mortos de volta à vida."}, {"nome": "Santuário", "stats": {"estagio": "Novato", "pp": "2", "dist": "Toque", "dur": "5", "escola": "Encantamento", "manif": "Palavras de poder, símbolo sagrado, luz brilhante"}, "body": ["Qualquer criatura viva tentando causar dano ou afetar o receptor deve fazer uma rolagem de Espírito (-2 se conjurado com uma ampliação). Se a rolagem falhar, a criatura perde sua ação.", "Se qualquer um sob os efeitos de <i>santuário<\/i> tenta ferir um ser vivo (maligno ou não), os efeitos dos benefícios de <i>santuário<\/i> são perdidos imediatamente."], "mods": [{"name": "Área", "epic": false, "desc": ["Por +2 pontos, O poder afeta todos os aliados dentro de um Modelo Médio de Explosão centrado na pessoa conjurando. Por +3 pontos a área de efeito é aumentada para um Modelo Grande de Explosão."], "cost": "+2/+3"}, {"name": "Forte", "epic": true, "desc": ["As rolagens de Espírito da criatura são feitas com -2 (-4 com uma ampliação)."], "cost": "+1"}], "page": 208, "tabelas": [], "notas": [], "resumo": "Oponentes devem fazer uma rolagem de Espírito para atacar."}, {"nome": "Som/Silêncio", "stats": {"estagio": "Novato", "pp": "1", "dist": "Astúcia x5 ( som ); Astúcia ( silêncio )", "dur": "Instantâneo ( som ); 5 ( silêncio )", "escola": "Ilusão", "manif": "Efeitos mágicos, uma ondulação no ar, um sino ou campainha que começa ou para de tocar."}, "body": ["<i>Som<\/i> imita qualquer som ou voz conhecida, emanando de um ponto de origem dentro da Distância e com um volume até o de um grito alto. Se usado como um Desafio, a rolagem de conjuração é resistida com Astúcia.", "<i>Silêncio<\/i> faz o contrário, silenciando todos os sons até a altura de um grito alto em um Modelo Grande de Explosão. Isso subtrai 4 de rolagens de Perceber feitas por aqueles na área, bem como para qualquer um tentando ouvir sons de dentro dela. Uma ampliação silencia completamente todo som dentro do modelo – de modo que todas as rolagens de Perceber falham automaticamente."], "mods": [{"name": "Mirado", "epic": false, "desc": ["Em vez de conjurar <i>silêncio<\/i> em uma área, é possível mirar em indivíduos dentro da Distância por 1 Ponto de Poder cada. Alvos relutantes resistem com Espírito (com -2 se o conjurador conseguiu uma ampliação)."], "cost": "+0"}, {"name": "Móvel", "epic": false, "desc": ["Uma vez conjurada a área de efeito pode ser movida um número de quadros igual ao dado de perícia arcana do conjurador."], "cost": "+1"}, {"name": "Som/Silêncio Melhorado", "epic": true, "desc": ["A rolagem de Astúcia feita para resistir a um Desafio (ou modificador Mirado) é feita com -2."], "cost": "+1"}], "page": 208, "tabelas": [], "notas": [], "resumo": "Cria ou abafa som."}, {"nome": "Sono", "stats": {"estagio": "Experiente", "pp": "2", "dist": "Astúcia", "dur": "Uma hora", "escola": "Encantamento", "manif": "Uma canção de ninar, soprar pó ou areia nos alvos."}, "body": ["Personagens que preferem a furtividade ou querem evitar ferir oponentes são atraídas por este feitiço que coloca suas vítimas em um estado de sono profundo.", "Qualquer pessoa afetada por <i>sono<\/i> deve fazer uma rolagem de Espírito (com -2 se o conjurador conseguiu uma ampliação em sua rolagem de perícia arcana). Quem falha cai no sono pela Duração do feitiço. Barulhos muito altos ou tentativas de acordar fisicamente alguém adormecido (o sacudindo, por exemplo) garantem outra rolagem de Espírito."], "mods": [{"name": "Área", "epic": false, "desc": ["Por +2 pontos o poder afeta quem estiver dentro de um Modelo Médio de Explosão. Por +3 pontos a área de efeito é aumentada para um Modelo Grande de Explosão."], "cost": "+2/+3"}], "page": 209, "tabelas": [], "notas": [], "resumo": "Coloca as vítimas pra dormir."}, {"nome": "Telecinese", "stats": {"estagio": "Experiente", "pp": "5", "dist": "Astúcia x2", "dur": "5", "escola": "Transmutação", "manif": "Um aceno de mão, varinha mágica, olhar penetrante."}, "body": ["<i>Telecinese<\/i> é a habilidade de mover objetos ou criaturas (incluindo a própria pessoa que conjura) com a vontade arcana. Tem força d10, ou d12 com uma ampliação.", "Oponentes relutantes resistem à perícia arcana com uma rolagem de Espírito quando são alvos e depois disso no começo de cada um de seus turnos até que ganhem liberdade. É possível mover estas pessoas a até a Astúcia de quem usa o poder em qualquer direção e batê-las contra paredes, tetos ou outros obstáculos com um dano de For+d6.", "Criaturas largadas sofrem dano por queda normalmente.", "<b>Ferramentas Telecinéticas:<\/b> É possível portar ferramentas (incluindo armas) com <i>telecinese<\/i> como uma ação. Use a perícia relevante do conjurador quando estiver atacando dessa maneira (não sua perícia arcana)."], "mods": [{"name": "Poder", "epic": true, "desc": ["A Força da <i>telecinese<\/i> é d12 ou d12 + 2 com uma ampliação. Bater as vítimas causa For+d6 de dano. Objetos pesando 1.000 Kg ou mais são tratados como armas pesadas."], "cost": "+3"}], "page": 209, "tabelas": [], "notas": [], "resumo": "Move itens com Força d10 (d12 com uma ampliação)."}, {"nome": "Teleporte", "stats": {"estagio": "Experiente", "pp": "2", "dist": "Astúcia", "dur": "Instantânea", "escola": "Invocação", "manif": "Uma nuvem de fumaça, “desaparecimento”, transformar-se em um raio de luz."}, "body": ["<i>Teleporte<\/i> permite desaparecer e instantaneamente reaparecer em até 12 quadros (24 metros) de distância ou o dobro disso com uma ampliação.", "Oponentes adjacentes a alguém que se teleporta não ganham um ataque livre (veja <b>Retirada de Combate Corpo a Corpo<\/b>, página 148).", "Se conjurar <i>teleporte<\/i> em um alvo voluntário, quem conjura decide para onde se move, não o alvo."], "mods": [{"name": "Portal", "epic": true, "desc": ["Em vez de teleportar, quem conjura abre um portal temporário conectando sua localização atual com o destino. Criaturas e objetos podem viajar através deste portal de cada lado por 5 rodadas."], "cost": "+5"}, {"name": "Receptores Adicionais", "epic": false, "desc": ["O poder afeta um novo alvo para cada Ponto de Poder adicional."], "cost": "+1"}, {"name": "Teleportar Inimigo", "epic": false, "desc": ["Inimigos podem ser alvo de um ataque de <b>Toqu<\/b> e (página 138). Isso é uma ação, que deve ser a segunda parte de uma Ação Múltipla se o ataque for bem-sucedido. O inimigo resiste à conjuração com uma rolagem de Espírito contra o valor total da rolagem da perícia arcana e é mandando para 12 quadros de distância com sucesso e 24 com uma ampliação. Inimigos não podem ser teleportados para dentro de objetos sólidos, como o interior de uma parede, por exemplo."], "cost": "+2"}, {"name": "Teleporte Melhorado", "epic": true, "desc": ["É possível se teleportar muito mais longe. Quem conjura precisa se concentrar em seu destino por pelo menos uma rodada, não assumindo nenhuma outra ação. Isso o deixa Vulnerável; se Abalado ou Atordoado, o feitiço falha.", "Por uma rodada de concentração, é possível teleportar a até 150 quilômetros. Por duas rodadas se pode viajar 1500 quilômetros e com três rodadas é possível ir para qualquer lugar de Golarion.", "Se já esteve lá fisicamente não há necessidade de modificador na rolagem. Com um sucesso chega a 2d6 x 3 metros da localidade alvo, ou no alvo com uma ampliação.", "Se possuir um mapa detalhado ou tiver visto o local por um poder ou dispositivo, sofre uma penalidade de -2 na rolagem. Com um sucesso chega a 2d6 x 30 metros da localidade alvo, ou no alvo com uma ampliação.", "Se possuir um mapa impreciso ou uma noção geral do local em um mapa regional ou mundial, o redutor é de -4. Com um sucesso chega a 2d10 quilômetros ou 2d6 x 30 metros com uma ampliação.", "Na ausência destas informações, não é possível teleportar.", "Uma Falha Crítica transporta o alvo para uma localização aleatória (decisão do Mestre) no mesmo plano de existência."], "cost": "+5"}], "page": 209, "tabelas": [], "notas": [], "resumo": "A personagem se teleporta até 12 quadros de distância."}, {"nome": "Viagem Planar", "stats": {"estagio": "Veterano", "pp": "4", "dist": "Astúcia", "dur": "Instantânea", "escola": "Invocação", "manif": "Buraco cósmico no espaço, círculo de runas mágicas."}, "body": ["<i>Viagem planar<\/i> permite que quem conjurou se mova diretamente para outro plano de existência (veja a página 161). Se viajar para uma localização conhecida, um sucesso indica que o alvo aparece a até 10d10 quilômetros do localidade pretendida. Com uma ampliação, aparece à metade dessa distância.", "Se não souber exatamente para onde quer ir, é possível pesquisar localidades daquele plano para encontrar uma cidade específica, localização geográfica etc. Falha significa que chega em uma localização completamente randômica naquele plano. Sucesso o coloca nos arredores e uma ampliação o coloca ainda mais perto do local desejado. Isso é um acréscimo à precisão da rolagem da perícia arcana."], "mods": [{"name": "Espaço Extra-Dimensional", "epic": true, "desc": ["Em vez de viajar para um plano conhecido, o receptor viaja para uma dimensão de bolso onde ele conjura um abrigo mágico ou uma estrutura similar com necessidades básicas, comida e água para até cinco pessoas. A estrutura se mantém após isso e é possível que retorne com seus companheiros para este espaço ou um novo, como preferir."], "cost": "+1"}, {"name": "Receptores Adicionais", "epic": false, "desc": ["O poder afeta um novo alvo para cada Ponto de Poder adicional."], "cost": "+1"}, {"name": "Transportar Inimigo", "epic": true, "desc": ["Quem conjura envia um alvo relutante para outro plano ou espaço extra-dimensional. O ser resiste à conjuração com uma rolagem de Espírito. Se falhar, ele é transportado para outro plano a escolha de quem conjurou por três rodadas (cinco com uma ampliação) antes de retornar para onde estava (ou o mais próximo se o seu espaço está ocupado)."], "cost": "+2"}], "page": 210, "tabelas": [], "notas": [], "resumo": "Permite viajar para outros planos de existência."}, {"nome": "Vidência", "stats": {"estagio": "Experiente", "pp": "3", "dist": "Pessoal", "dur": "5", "escola": "Adivinhação", "manif": "Imagens em uma superfície reflexiva, olhos brilhantes, uma bola de cristal."}, "body": ["<i>Vidência<\/i> permite espiar secretamente um alvo a uma distância segura. Preparar o feitiço leva um minuto inteiro enquanto quem conjura se foca no item, criatura ou localização alvo. Isso deixa quem conjura Vulnerável e incapaz de realizar qualquer outra ação. Se ficar em estado Abalado ou Atordoado durante esse tempo o poder falha.", "Se quem conjura nunca viu o alvo, é necessário uma rolagem de perícia arcana -2. <i>Vidência<\/i> em um alvo de um plano de existência diferente também impõem uma penalidade de -2.", "<i>Vidência<\/i> é resistida pelo Espírito do alvo. Se o alvo vencer, sabe que está sendo espiado. Se quem conjura vence, é possível ver e ouvir o alvo e a área ao seu redor, mas não pode mudar sua perspectiva. Com uma ampliação é possível mudar a perspectiva e seguir o alvo com Movimentação 24.", "Um “olho” de <i>vidência<\/i> pode ser visto com <i>detectar arcana<\/i> (mas não detectar magia). Também pode ser usado <i>dissipar<\/i> (com -2 se houver suspeita, mas não for revelado)."], "mods": [{"name": "Visão em Grupo", "epic": false, "desc": ["É possível compartilhar a visão com aliados dentro do Alcance da Astúcia de quem conjura pela Duração do Poder."], "cost": "+1"}], "page": 211, "tabelas": [], "notas": [], "resumo": "Conjurador pode ver e escutar um alvo e a área ao redor de forma remota."}, {"nome": "Visão Distante", "stats": {"estagio": "Experiente", "pp": "2", "dist": "Astúcia", "dur": "5", "escola": "Transmutação", "manif": "Alvos invisivelmente marcados, ventos guiando, olhos de águia."}, "body": ["<i>Visão Distante<\/i> permite que o alvo enxergue com detalhes a grandes distâncias. Pode ler lábios ou letras miúdas a um quilômetro de distância.", "Com uma ampliação, também reduz à metade penalidades por Distância para Atirar, Atletismo (arremessar) ou outras habilidades afetadas por Distância."], "mods": [{"name": "Receptores Adicionais", "epic": false, "desc": ["O poder afeta um novo alvo para cada Ponto de Poder adicional."], "cost": "+1"}, {"name": "Visão Distante Melhorada", "epic": true, "desc": ["Permite ao receptor ignorar todas as penalidades de Distância e uma ampliação dobra o alcance da visão."], "cost": "+2"}], "page": 211, "tabelas": [], "notas": [], "resumo": "Veja detalhes a grandes distâncias; com uma ampliação, diminui penalidades por Distância à metade."}, {"nome": "Visão Sombria", "stats": {"estagio": "Novato", "pp": "1", "dist": "Astúcia", "dur": "Uma hora", "escola": "Transmutação", "manif": "Olhos brilhantes, pupilas dilatadas, sonar."}, "body": ["<i>Visão Sombria<\/i> permite que uma pessoa enxergue no escuro. Com um sucesso, ignora até 4 pontos de penalidades por iluminação. Com uma ampliação, ignora até seis pontos e pode enxergar em situações onde está escuro como um breu."], "mods": [{"name": "Receptores Adicionais", "epic": false, "desc": ["O poder afeta um novo alvo para cada Ponto de Poder adicional."], "cost": "+1"}, {"name": "Visão Sombria Melhorada", "epic": true, "desc": ["Os sentidos do receptor se estendem tão além dos espectros infravermelho e ultravioleta que ignora todas as penalidades de iluminação e 4 pontos de penalidade de criaturas <i>invisíveis<\/i>."], "cost": "+2"}], "page": 211, "tabelas": [], "notas": [], "resumo": "Ignora até 4 pontos de penalidades por iluminação, ou 6 com uma ampliação."}, {"nome": "Voar", "stats": {"estagio": "Veterano", "pp": "3", "dist": "Astúcia", "dur": "5", "escola": "Transmutação", "manif": "Rajadas de vento, anéis, vassouras"}, "body": ["<i>Voar<\/i> permite planar com uma Movimentação de 12 quadros, ou o dobro disso com uma ampliação (não é possível correr)."], "mods": [{"name": "Receptores Adicionais", "epic": false, "desc": ["O poder afeta um novo alvo para cada dois Pontos de Poder adicionais."], "cost": "+2"}, {"name": "Voo Rápido", "epic": false, "desc": ["A Movimentação base do voo aumenta para 24 ou 48 com uma ampliação."], "cost": "+5"}], "page": 211, "tabelas": [], "notas": [], "resumo": "Alvo voa com Movimentação 12."}, {"nome": "Zumbi", "stats": {"estagio": "Veterano", "pp": "3 (Veja o quadro lateral para criaturas maiores)", "dist": "Astúcia", "dur": "Uma hora", "escola": "Necromancia", "manif": "Marcar símbolos em cadáveres, jogar ossos, cemitérios."}, "body": ["Esse poder concede animação e inteligência básica aos restos mortais do que já foi uma criatura viva. O horror conjurado é obediente, mas tem uma mente muito literal ao cumprir seus deveres. Não é telepata, então deve ser controlado por voz.", "A criatura possui as perícias físicas que tinha em vida, mas sua Astúcia, Espírito e perícias relacionadas são redefinidas em d4. Uma ampliação na rolagem de conjuração aumenta qualquer uma de suas Características em um tipo de dado (escolha de quem conjurou).", "Veja página 262 para o perfil padrão de um zumbi humano. Cadáveres não são conjurados por esta habilidade, então deve haver um suprimento de corpos dentro da Distância (critério do Mestre).", "Zumbis que sofreram Incapacitação por dano não podem sofrer uma segunda ressuscitação com este poder."], "mods": [{"name": "Armado", "epic": false, "desc": ["A pessoa ressuscita com uma arma enferrujada comum ao seu antecedente e ambiente. Escolha uma:", "• <b>Arma de Mão:<\/b> For+d6. • <b>Arma de Combate à Distância:<\/b> Distância 12/24/48, Dano 2d6."], "cost": "+1 por Zumbi"}, {"name": "Armadura", "epic": false, "desc": ["Os horrores saem de seus túmulos trajando 2 pontos de Armadura. Pode ser uma cota de malha velha, placas enferrujadas etc."], "cost": "+1 por Zumbi"}, {"name": "Esquelético", "epic": false, "desc": ["O cadáver se desprende do peso da carne morta e se ergue como um esqueleto. Isso aumenta sua Agilidade, Atletismo, Lutar e Atirar em um tipo de dado cada."], "cost": "+1 por Zumbi"}, {"name": "Passageiro da Mente", "epic": false, "desc": ["Permite se comunicar e sentir através de um dos mortos-vivos que conjurou. Se for destruído, pode passar para qualquer outro zumbi atualmente sob seu controle. Por 3 pontos, Passageiro da Mente afeta todos os zumbis criados nesta conjuração."], "cost": "+1/+3"}, {"name": "Permanente", "epic": false, "desc": ["O <i>zumbi<\/i> recebe sua não-vida até que sofra Incapacitação por Ferimentos. Os Pontos de Poder usados em sua ressuscitação são “investidos” e ficam indisponíveis até que ele seja destruído. Necromantes podem acabar com a não-vida de suas criações a qualquer momento, independente da visão, distância ou outros fatores. Seus Pontos de Poder então começam a recarregar normalmente."], "cost": "0"}, {"name": "Zumbis Adicionais", "epic": false, "desc": ["Uma horda maior pode ser ressuscitada com uma única conjuração pagando 1 Ponto de Poder adicional para cada <i>zumbi<\/i> extra ressuscitado.", "Zumbis permanentes continuam animados mesmo no caso de morte de quem os criou!"], "cost": "+1"}], "page": 212, "tabelas": [], "notas": [{"titulo": "Criaturas zumbificadas", "paras": ["Animais e outras criaturas também podem ser ressuscitadas com esta habilidade terrível! O custo é 2 para uma criatura de Tamanho -1 ou -2; 3 para Tamanho 0; 1 para um Bando Pequeno; 2 para um Bando Médio; e 3 para um Bando Grande.", "Criaturas maiores custam 3 + Tamanho em Pontos de Poder. Por exemplo, ressuscitar um urso pardo morto-vivo (Tamanho 2) custa 5 Pontos de Poder.", "Não são concedidas Habilidades Especiais mágicas ou sobrenaturais para o forma morta-viva, mas habilidades inerentes à criatura são, como Frenesi Aprimorado, Alcance, o ataque de um bando etc.", "Criaturas zumbificadas adicionais custam metade do seu custo base se ressuscitadas de uma vez, em vez do +1 listado por Zumbis Adicionais (arredonde para cima, mínimo de 1)."]}], "resumo": "Ressuscita e controla os mortos-vivos."}], "sumario": {}}</script>
<script>
var D=['—','d4','d6','d8','d10','d12'];
var AT=[['agi','Agilidade'],['ast','Astúcia'],['esp','Espírito'],['for','Força'],['vig','Vigor']];
var KEY='ficha-sw-pf',IXK=KEY+':idx',FK=KEY+':f:',IK=KEY+':i:';
var S=null,CUR=null,IMGD='',IDX=[],VIEW='lobby',TAB='ficha',CB=null,AB=null,LR=null,LD=null,WARN=0;
var ES=['Novato','Experiente','Veterano','Heroico','Lendário'];
var $=function(i){return document.getElementById(i)};
function est(p){return ES[Math.min(4,Math.floor((+p||0)/4))]}
/* ---------- armazenamento ---------- */
var MEM={},NOLS=false,DB=null,IDBOK=false,IDBK={};
(function(){try{localStorage.setItem(KEY+':t','1');localStorage.removeItem(KEY+':t')}catch(e){NOLS=true}})();
/* reserva: IndexedDB (limite muito maior que o do localStorage), espelhado em MEM */
function idbOpen(cb){var done=false;function fin(){if(!done){done=true;cb()}}
try{if(typeof indexedDB=='undefined'||!indexedDB){fin();return}
var rq=indexedDB.open('ficha-sw-pf',1);
rq.onupgradeneeded=function(){try{rq.result.createObjectStore('kv')}catch(e){}};
rq.onsuccess=function(){DB=rq.result;try{var c=DB.transaction('kv','readonly').objectStore('kv').openCursor();c.onsuccess=function(){var cur=c.result;if(cur){MEM[cur.key]=cur.value;IDBK[cur.key]=1;cur.continue()}else{IDBOK=true;fin()}};c.onerror=function(){fin()}}catch(e){fin()}};
rq.onerror=function(){fin()};rq.onblocked=function(){fin()};
setTimeout(fin,2500)}catch(e){fin()}}
function idbPut(k,v){if(!DB)return;try{var tx=DB.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);IDBK[k]=1;tx.onerror=tx.onabort=function(){IDBOK=false;banner()}}catch(e){IDBOK=false;banner()}}
function idbDel(k){if(!DB||!IDBK[k])return;delete IDBK[k];try{DB.transaction('kv','readwrite').objectStore('kv').delete(k)}catch(e){}}
function rd(k){if(k in MEM)return MEM[k];if(NOLS)return null;try{return localStorage.getItem(k)}catch(e){return null}}
function wr(k,v){v=String(v);if(!NOLS){try{localStorage.setItem(k,v);if(k in MEM){delete MEM[k];idbDel(k)}return true}catch(e){}}MEM[k]=v;idbPut(k,v);banner();return true}
function lsDel(k){delete MEM[k];idbDel(k);if(!NOLS){try{localStorage.removeItem(k)}catch(e){}}}
function lsKeys(){var a=[];if(!NOLS){try{for(var i=0;i<localStorage.length;i++)a.push(localStorage.key(i))}catch(e){}}Object.keys(MEM).forEach(function(k){if(a.indexOf(k)<0)a.push(k)});return a}
function outros(){var n=0;if(NOLS)return 0;try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(KEY)!=0)n+=k.length+(localStorage.getItem(k)||'').length}}catch(e){}return Math.round(n*2/1024)}
var BANDONE=false,BT=null;
function closeBanner(){BANDONE=true;clearTimeout(BT);var el=$('nost');if(el)el.hidden=true}
function banner(){var el=$('nost');if(!el||BANDONE||!el.hidden)return;var o=outros(),ok=IDBOK&&DB;
$('nostt').textContent=ok?'ℹ O armazenamento padrão do navegador está cheio ou bloqueado, então a página está guardando as fichas no armazenamento alternativo (IndexedDB). Elas continuam salvas neste navegador. Mesmo assim, use Exportar como cópia de segurança.'+(o?' Outras páginas abertas do disco estão usando ~'+o+' KB do armazenamento padrão.':''):'⚠ O navegador não aceitou gravar (sem espaço ou sem permissão) e não há armazenamento alternativo disponível. A página funciona, mas o que não foi gravado some ao fechar ou recarregar. Use Exportar para guardar.'+(o?' Outras páginas abertas do disco estão usando ~'+o+' KB.':'');
el.style.background=ok?'#2f4f6b':'#7a5a10';el.hidden=false;BT=setTimeout(closeBanner,15000)}
function tst(m){var el=$('toast');el.textContent=m;el.style.display='block';clearTimeout(el.t);el.t=setTimeout(function(){el.style.display='none'},5000)}
function warn(){if(Date.now()-WARN>8000){WARN=Date.now();tst('Não foi possível salvar: o armazenamento do navegador está cheio. Exporte as fichas e apague o que não precisa.')}}
function nid(){return 'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function metaOf(id,s){return{id:id,nome:s.nome||'',anc:s.anc||'',classe:s.classe||'',prog:+s.prog||0,t:Date.now()}}
function saveIdx(){if(!wr(IXK,JSON.stringify(IDX)))warn()}
function loadIdx(){var raw=rd(IXK);
if(raw!==null){try{var a=JSON.parse(raw);if(Array.isArray(a))return a.filter(function(m){return m&&m.id})}catch(e){}}
var found=[];lsKeys().forEach(function(k){if(k&&k.indexOf(FK)==0){var id=k.slice(FK.length),j=null;try{j=JSON.parse(rd(k))}catch(e){}if(j&&j.att)found.push(metaOf(id,j))}});
return(raw===null&&!found.length)?null:found}
function boot(){IDX=loadIdx();
if(IDX===null){IDX=[];var old=null;try{old=JSON.parse(rd(KEY))}catch(e){}
if(old&&old.att){var id=nid(),o=mig(old);if(wr(FK+id,JSON.stringify(o))){IDX.push(metaOf(id,o));saveIdx()}else warn()}else saveIdx()}
else saveIdx()}
function save(){if(!CUR||!S)return;if(!wr(FK+CUR,JSON.stringify(S)))warn();
for(var i=0;i<IDX.length;i++)if(IDX[i].id==CUR){var m=IDX[i];if(m.nome!=(S.nome||'')||m.anc!=(S.anc||'')||m.classe!=(S.classe||'')||m.prog!=(+S.prog||0)){IDX[i]=metaOf(CUR,S);saveIdx()}return}
IDX.unshift(metaOf(CUR,S));saveIdx()}

function moneyTx(sg){var u=$('mu2').value,f={pc:1,pp:10,po:100,pl:1000}[u],v=parseFloat(String($('mv2').value).replace(',','.'));if(!(v>0)){tst('Informe um valor.');return}

/* ===== Compêndio de poderes (pp. 185-215 do PDF) ===== */
var CO={q:'',e:'',s:'',ep:false,v:'l',sort:'nome',dir:1,P:null,D:null},CORD=['Novato','Experiente','Veterano','Heroico','Lendário'];
function conz(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function cotx(h){return h.replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&amp;/g,'&')}
function colab(t){return t.replace(/^([^:<]{3,30}:)/,'<b>$1</b>')}
function coInit(){if(CO.P)return;CO.D=JSON.parse($('cdata').textContent);CO.P=CO.D.powers;CO.P.forEach(function(p){var s=p.stats;['dur','dist','pp','escola'].forEach(function(k){s[k]=s[k].replace(/\(\s+/g,'(').replace(/\s+\)/g,')').replace(/\s+;/g,';')});if(/^\d+$/.test(s.dur))s.dur+=' rodadas'});
 CO.P.forEach(function(p,i){p.i=i;p.epics=p.mods.filter(function(m){return m.epic}).length;p.n=parseFloat(p.stats.pp);if(isNaN(p.n))p.n=99;
  var a=[p.nome,p.stats.manif,p.stats.escola].concat(p.body);p.mods.forEach(function(m){a.push(m.name);a=a.concat(m.desc)});
  (p.fichas||[]).forEach(function(f){a.push(f.titulo);a=a.concat(f.linhas)});(p.notas||[]).forEach(function(n){a=a.concat(n.paras)});a.push(p.resumo||'');a.push(p.resumo||'');p.blob=conz(cotx(a.join(' ')))})}
function coVis(p){if(CO.e&&p.stats.estagio!==CO.e)return false;if(CO.s&&p.stats.escola.indexOf(CO.s)<0)return false;if(CO.ep&&!p.epics)return false;
 if(CO.q){var w=conz(CO.q).split(/\s+/);for(var k=0;k<w.length;k++)if(p.blob.indexOf(w[k])<0)return false}return true}
function coPP(s){var m=/^(\d+)/.exec(s.pp);return m?m[1]+(s.pp.length>m[1].length?'+':''):'Esp.'}
function coPP(s){var m=/^(\d+)/.exec(s.pp);return m?m[1]+(s.pp.length>m[1].length?'+':''):'Esp.'}
function coCard(p){var s=p.stats,ini=conz(p.nome).charAt(0).toUpperCase(),h='<details class="p" id="coc'+p.i+'" data-st="'+s.estagio+'" data-ini="'+ini+'"><summary><div class="sm"><span class="nm">'+p.nome+'</span>'+(p.resumo?'<span class="rs">'+p.resumo+'</span>':'')+'<span class="meta"><span class="stg">'+s.estagio+'</span><span>'+s.dist+'</span><span>·</span><span>'+s.dur+'</span>'+(p.epics?'<span class="star" title="'+p.epics+' modificador(es) Épico(s)">★ '+p.epics+'</span>':'')+'</span></div><span class="ppb"><b>'+coPP(s)+'</b><small>PP</small></span></summary><div class="bd">';
 h+='<div class="stats"><div><small>Estágio</small>'+s.estagio+'</div><div><small>Pontos de Poder</small>'+s.pp+'</div><div><small>Distância</small>'+s.dist+'</div><div><small>Duração</small>'+s.dur+'</div><div><small>Escola</small>'+s.escola+'</div></div>';
 if(s.manif)h+='<div class="man"><b>Manifestações:</b> '+s.manif+'</div>';
 p.body.forEach(function(b){h+='<p>'+colab(b)+'</p>'});
 (p.tabelas||[]).forEach(function(t){h+='<h3>'+t.titulo.toUpperCase()+'</h3><div class="tw"><table><thead><tr>'+t.cab.map(function(c){return'<th>'+c+'</th>'}).join('')+'</tr></thead><tbody>'+t.linhas.map(function(r){return'<tr>'+r.map(function(c){return'<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'+(t.nota?'<p class="man">'+t.nota+'</p>':'')});
 if((p.fichas||[]).length)h+='<h3>FICHAS DOS ALIADOS</h3>';
 (p.fichas||[]).forEach(function(f){h+='<div class="box"><h4>'+f.titulo+'</h4>'+f.linhas.map(function(l){return'<p>'+colab(l)+'</p>'}).join('')+'</div>'});
 (p.notas||[]).forEach(function(n){h+='<div class="box"><h4>'+n.titulo+'</h4>'+n.paras.map(function(l){return'<p>'+l+'</p>'}).join('')+'</div>'});
 if(p.mods.length){h+='<h3>MODIFICADORES</h3>';p.mods.forEach(function(m){h+='<div class="mr'+(m.epic?' epic':'')+'"><span class="cost">'+(m.cost||'—')+'</span><div><span class="mn">'+(m.epic?'<span class="star" title="Poder Épico (Maestria Arcana/Divina)">★ </span>':'')+m.name+'</span>'+m.desc.map(function(x){return'<p>'+x+'</p>'}).join('')+'</div></div>'})}
 return h+'<button class="add no" data-coadd="'+p.i+'">+ Adicionar à ficha</button></div></details>'}
function coAdd(i){var p=CO.P[i],s=p.stats;if(!S){return}
 if(S.pw.some(function(x){return conz(x.n||'')==conz(p.nome)})){tst('“'+p.nome+'” já está na aba Poderes.');return}
 var pp=/^\d+$/.test(s.pp)?s.pp:'',d=['Escola: '+s.escola+(s.manif?' · Manifestações: '+cotx(s.manif):'')];
 if(!pp)d.push('Custo em PP: '+cotx(s.pp)+'.');
 p.body.forEach(function(b){d.push(cotx(b))});
 S.pw.push({n:p.nome,d:d.join('\n\n'),pp:pp,r:s.dist,dur:s.dur,sk:'',dm:'',lim:0,mm:p.mods.map(function(m){return m.name+(m.cost?' ('+m.cost+')':'')}).join('\n')});
 save();tst('“'+p.nome+'” adicionado à aba Poderes.')}
function renderCo(){coInit();
 var h='<div class="co"><div class="co-bar"><div class="r"><input type="search" id="coq" placeholder="Buscar poder, efeito ou modificador…" aria-label="Buscar poder" value="'+CO.q.replace(/"/g,'&quot;')+'"><select id="cos" aria-label="Escola"><option value="">Todas as escolas</option></select><span class="seg"><button data-cov="l" class="'+(CO.v=='l'?'on':'')+'">Lista</button><button data-cov="t" class="'+(CO.v=='t'?'on':'')+'">Tabela</button><button data-cov="i" class="'+(CO.v=='i'?'on':'')+'">Guia</button></span></div><div class="r sc" id="coe">'+['Todos'].concat(CORD).map(function(n){return'<button data-coe="'+n+'" data-st="'+n+'" class="'+((n==='Todos'&&!CO.e)||n===CO.e?'on':'')+'">'+n+'</button>'}).join('')+'<span class="sp"></span><button id="coep" class="'+(CO.ep?'on':'')+'">★ Épicos</button><button data-coall="1" title="Expandir todos">Abrir</button><button data-coall="0" title="Recolher todos">Fechar</button></div><div class="r az" id="coaz"></div></div><p class="co-ct" id="coct"></p><div id="coc"></div></div>';
 $('app').innerHTML=h;var es={};CO.P.forEach(function(p){p.stats.escola.split(/;|\(/).forEach(function(x){x=x.replace(/\)/g,'').replace(/aumentar|reduzir/g,'').trim();if(x&&/^[A-ZÁÉÍÓÚÂÊÔÃÕÇ]/.test(x))es[x]=1})});
 Object.keys(es).sort().forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=k;if(k===CO.s)o.selected=true;$('cos').appendChild(o)});
 $('coq').oninput=function(){CO.q=this.value;coList()};$('cos').onchange=function(){CO.s=this.value;coList()};
 $('coep').onclick=function(){CO.ep=!CO.ep;this.className=CO.ep?'on':'';coList()};
 [].forEach.call(document.querySelectorAll('[data-coe]'),function(b){b.onclick=function(){CO.e=b.dataset.coe==='Todos'?'':b.dataset.coe;[].forEach.call(document.querySelectorAll('[data-coe]'),function(x){x.className=x===b?'on':''});coList()}});
 [].forEach.call(document.querySelectorAll('[data-cov]'),function(b){b.onclick=function(){CO.v=b.dataset.cov;[].forEach.call(document.querySelectorAll('[data-cov]'),function(x){x.className=x===b?'on':''});coList()}});
 [].forEach.call(document.querySelectorAll('[data-coall]'),function(b){b.onclick=function(){if(CO.v!='l'){CO.v='l';coList()}[].forEach.call(document.querySelectorAll('.co details.p'),function(x){x.open=b.dataset.coall=='1'})}});
 $('coaz').onclick=function(e){var b=e.target.closest('[data-az]');if(!b||b.disabled)return;var c=document.querySelector('#coc [data-ini="'+b.dataset.az+'"]');if(c)c.scrollIntoView({behavior:'smooth'})};
 $('coc').onclick=function(e){var a=e.target.closest('[data-coadd]');if(a){coAdd(+a.dataset.coadd);return}
  var th=e.target.closest('th[data-k]');if(th){var k=th.dataset.k;if(CO.sort===k)CO.dir=-CO.dir;else{CO.sort=k;CO.dir=1}coList();return}
  var tr=e.target.closest('tr[data-i]');if(tr){CO.v='l';CO.q='';$('coq').value='';[].forEach.call(document.querySelectorAll('[data-cov]'),function(x){x.className=x.dataset.cov=='l'?'on':''});coList();var c=$('coc'+tr.dataset.i);if(c){c.open=true;c.scrollIntoView()}}};
 coList()}
function coAZ(L){var have={};L.forEach(function(p){have[conz(p.nome).charAt(0).toUpperCase()]=1});var el=$('coaz');el.hidden=CO.v!='l';el.innerHTML='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').filter(function(c){return CO.P.some(function(p){return conz(p.nome).charAt(0).toUpperCase()==c})}).map(function(c){return'<button data-az="'+c+'"'+(have[c]?'':' disabled')+'>'+c+'</button>'}).join('')}
function coList(){var L=CO.P.filter(coVis),el=$('coc');$('coct').textContent=CO.v=='i'?'':L.length+' de '+CO.P.length+' poderes'+(CO.q||CO.e||CO.s||CO.ep?' (filtrado)':'');
 coAZ(L);coAZ(L);if(CO.v=='l'){el.innerHTML=L.length?L.map(coCard).join(''):'<p class="pt">Nenhum poder encontrado.</p>'}
 else if(CO.v=='i'){el.innerHTML=CO.D.intro.map(function(x){return'<p>'+x+'</p>'}).join('')+'<div class="box"><h4>Nomeando poderes</h4>'+CO.D.nomeando.map(function(x){return'<p>'+x+'</p>'}).join('')+'</div>'}
 else{var C=[['nome','Poder'],['estagio','Estágio'],['pp','PP'],['dist','Distância'],['dur','Duração'],['escola','Escola'],['mods','Mod.']];
  var K=function(p){var k=CO.sort;if(k=='nome')return conz(p.nome);if(k=='estagio')return CORD.indexOf(p.stats.estagio);if(k=='pp')return p.n;if(k=='mods')return p.mods.length;return conz(p.stats[k])};
  L=L.slice().sort(function(a,b){var x=K(a),y=K(b);return(x>y?1:x<y?-1:0)*CO.dir});
  el.innerHTML='<div class="tw"><table id="cotb"><thead><tr>'+C.map(function(c){return'<th data-k="'+c[0]+'">'+c[1]+(CO.sort===c[0]?(CO.dir>0?' ▲':' ▼'):'')+'</th>'}).join('')+'</tr></thead><tbody>'+L.map(function(p){var s=p.stats;return'<tr data-i="'+p.i+'"><td><b>'+p.nome+'</b></td><td>'+s.estagio+'</td><td>'+s.pp.split(' (')[0]+'</td><td>'+s.dist+'</td><td>'+s.dur+'</td><td>'+s.escola+'</td><td>'+p.mods.length+(p.epics?' (★'+p.epics+')':'')+'</td></tr>'}).join('')+'</tbody></table></div><p class="pt">Clique no título da coluna para ordenar e numa linha para abrir o poder.</p>'}}
